# HTTP 重定向到 HTTPS
server {
    listen 80;
    server_name samd.top www.samd.top;
    return 301 https://$server_name$request_uri;
}

# HTTPS 配置
server {
    listen 443 ssl http2;
    server_name samd.top www.samd.top;
    
    root /var/www/samd/dist;
    index index.html;
    
    # SSL 证书配置（请替换为实际证书路径）
    # ssl_certificate /etc/letsencrypt/live/samd.top/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/samd.top/privkey.pem;
    
    # API 代理
    location /api {
        proxy_pass http://localhost:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|mp4|webp)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
    
    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
