<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坦克大战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        .game-container {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        
        .game-wrapper {
            background: #000;
            border: 4px solid #ffd700;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }
        
        canvas {
            display: block;
        }
        
        .info-panel {
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid #ffd700;
            border-radius: 10px;
            padding: 20px;
            color: #fff;
            min-width: 200px;
        }
        
        .info-panel h2 {
            color: #ffd700;
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .stat {
            margin: 15px 0;
            font-size: 16px;
        }
        
        .stat-label {
            color: #aaa;
            display: block;
            margin-bottom: 5px;
        }
        
        .stat-value {
            color: #ffd700;
            font-size: 24px;
            font-weight: bold;
        }
        
        .controls {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #444;
        }
        
        .controls h3 {
            color: #ffd700;
            margin-bottom: 15px;
            font-size: 18px;
        }
        
        .control-item {
            margin: 8px 0;
            color: #ccc;
            font-size: 14px;
        }
        
        .key {
            background: #333;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid #666;
            color: #ffd700;
            font-weight: bold;
        }
        
        .game-over-screen, .start-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 4px solid #ffd700;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            color: #fff;
            z-index: 100;
        }
        
        .game-over-screen h1, .start-screen h1 {
            color: #ffd700;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8);
        }
        
        .game-over-screen p, .start-screen p {
            font-size: 20px;
            margin: 15px 0;
            color: #ccc;
        }
        
        .btn {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.6);
        }
        
        .hidden {
            display: none !important;
        }
        
        .lives-container {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }
        
        .life-icon {
            width: 20px;
            height: 20px;
            background: #4CAF50;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-wrapper">
            <canvas id="gameCanvas" width="640" height="672"></canvas>
        </div>
        
        <div class="info-panel">
            <h2>🎮 游戏信息</h2>
            
            <div class="stat">
                <span class="stat-label">得分</span>
                <div class="stat-value" id="score">0</div>
            </div>
            
            <div class="stat">
                <span class="stat-label">关卡</span>
                <div class="stat-value" id="level">1</div>
            </div>
            
            <div class="stat">
                <span class="stat-label">生命值</span>
                <div class="lives-container" id="lives"></div>
            </div>
            
            <div class="stat">
                <span class="stat-label">敌人剩余</span>
                <div class="stat-value" id="enemies">0</div>
            </div>
            
            <div class="controls">
                <h3>🎯 操作说明</h3>
                <div class="control-item"><span class="key">↑↓←→</span> 移动坦克</div>
                <div class="control-item"><span class="key">空格</span> 发射子弹</div>
                <div class="control-item"><span class="key">P</span> 暂停游戏</div>
            </div>
        </div>
    </div>
    
    <div class="start-screen" id="startScreen">
        <h1>🎖️ 坦克大战 🎖️</h1>
        <p>经典FC游戏重现</p>
        <p>消灭所有敌人，保护你的基地！</p>
        <button class="btn" onclick="startGame()">开始游戏</button>
    </div>
    
    <div class="game-over-screen hidden" id="gameOverScreen">
        <h1 id="gameOverTitle">游戏结束</h1>
        <p id="finalScore">最终得分: 0</p>
        <p id="gameOverMessage"></p>
        <button class="btn" onclick="restartGame()">重新开始</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const TILE_SIZE = 32;
        const MAP_WIDTH = 20;
        const MAP_HEIGHT = 21;
        
        const TILE_EMPTY = 0;
        const TILE_BRICK = 1;
        const TILE_STEEL = 2;
        const TILE_WATER = 3;
        const TILE_GRASS = 4;
        const TILE_BASE = 5;
        
        let gameState = 'start';
        let score = 0;
        let level = 1;
        let lives = 3;
        let isPaused = false;
        let player = null;
        let enemies = [];
        let bullets = [];
        let explosions = [];
        let map = [];
        let baseDestroyed = false;
        let enemiesRemaining = 0;
        let maxEnemiesOnScreen = 4;
        let enemySpawnTimer = 0;
        let enemySpawnInterval = 180;
        
        const maps = [
            [
                "00000000000000000000",
                "01110000000000001110",
                "01001001100110010010",
                "01001001100110010010",
                "01001000000000010010",
                "00001002222200100000",
                "00100002222000010010",
                "00100000000000010010",
                "00100110011001100010",
                "00000000000000000000",
                "00110011001100110000",
                "00000000000000000010",
                "01000000000000000010",
                "01001100110011001010",
                "01000000000000000010",
                "01000022002200000010",
                "00000022002200000000",
                "01100000000000000110",
                "00001111111111110000",
                "00000000000000000000",
                "00000000050000000000"
            ]
        ];
        
        class Tank {
            constructor(x, y, direction, isPlayer = false) {
                this.x = x;
                this.y = y;
                this.width = TILE_SIZE - 4;
                this.height = TILE_SIZE - 4;
                this.direction = direction;
                this.speed = isPlayer ? 2 : 1.5;
                this.isPlayer = isPlayer;
                this.bulletCooldown = 0;
                this.bulletCooldownMax = isPlayer ? 20 : 40;
                this.color = isPlayer ? '#4CAF50' : '#f44336';
                this.lastShot = 0;
                this.aiTimer = 0;
                this.aiChangeDirection = 60;
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
                
                switch(this.direction) {
                    case 'up': ctx.rotate(0); break;
                    case 'right': ctx.rotate(Math.PI / 2); break;
                    case 'down': ctx.rotate(Math.PI); break;
                    case 'left': ctx.rotate(-Math.PI / 2); break;
                }
                
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);
                
                ctx.fillStyle = this.isPlayer ? '#2E7D32' : '#c62828';
                ctx.fillRect(-this.width / 2 + 2, -this.height / 2 + 2, this.width - 4, this.height - 4);
                
                ctx.fillStyle = '#333';
                ctx.fillRect(-this.width / 2 + 4, -this.height / 2 + 4, 6, this.height - 8);
                ctx.fillRect(this.width / 2 - 10, -this.height / 2 + 4, 6, this.height - 8);
                
                ctx.fillStyle = '#555';
                ctx.fillRect(-4, -this.height / 2 - 4, 8, this.height / 2 + 4);
                
                ctx.restore();
            }
            
            move(dx, dy) {
                const newX = this.x + dx * this.speed;
                const newY = this.y + dy * this.speed;
                
                if (this.canMove(newX, newY)) {
                    this.x = newX;
                    this.y = newY;
                    return true;
                }
                return false;
            }
            
            canMove(newX, newY) {
                if (newX < 0 || newX + this.width > canvas.width || 
                    newY < 0 || newY + this.height > canvas.height) {
                    return false;
                }
                
                const tiles = this.getTilesAt(newX, newY);
                for (let tile of tiles) {
                    if (tile === TILE_BRICK || tile === TILE_STEEL || 
                        tile === TILE_WATER || tile === TILE_BASE) {
                        return false;
                    }
                }
                
                if (this.isPlayer) {
                    for (let enemy of enemies) {
                        if (this.collidesWith(newX, newY, enemy)) {
                            return false;
                        }
                    }
                } else {
                    if (player && this.collidesWith(newX, newY, player)) {
                        return false;
                    }
                    for (let enemy of enemies) {
                        if (enemy !== this && this.collidesWith(newX, newY, enemy)) {
                            return false;
                        }
                    }
                }
                
                return true;
            }
            
            getTilesAt(x, y) {
                const tiles = [];
                const startCol = Math.floor(x / TILE_SIZE);
                const endCol = Math.floor((x + this.width - 1) / TILE_SIZE);
                const startRow = Math.floor(y / TILE_SIZE);
                const endRow = Math.floor((y + this.height - 1) / TILE_SIZE);
                
                for (let row = startRow; row <= endRow; row++) {
                    for (let col = startCol; col <= endCol; col++) {
                        if (row >= 0 && row < MAP_HEIGHT && col >= 0 && col < MAP_WIDTH) {
                            tiles.push(map[row][col]);
                        }
                    }
                }
                return tiles;
            }
            
            collidesWith(x, y, other) {
                return x < other.x + other.width &&
                       x + this.width > other.x &&
                       y < other.y + other.height &&
                       y + this.height > other.y;
            }
            
            shoot() {
                if (this.bulletCooldown <= 0) {
                    let bulletX, bulletY;
                    const bulletSize = 6;
                    
                    switch(this.direction) {
                        case 'up':
                            bulletX = this.x + this.width / 2 - bulletSize / 2;
                            bulletY = this.y - bulletSize;
                            break;
                        case 'down':
                            bulletX = this.x + this.width / 2 - bulletSize / 2;
                            bulletY = this.y + this.height;
                            break;
                        case 'left':
                            bulletX = this.x - bulletSize;
                            bulletY = this.y + this.height / 2 - bulletSize / 2;
                            break;
                        case 'right':
                            bulletX = this.x + this.width;
                            bulletY = this.y + this.height / 2 - bulletSize / 2;
                            break;
                    }
                    
                    bullets.push(new Bullet(bulletX, bulletY, this.direction, this.isPlayer));
                    this.bulletCooldown = this.bulletCooldownMax;
                }
            }
            
            updateAI() {
                this.aiTimer++;
                
                if (this.aiTimer >= this.aiChangeDirection) {
                    this.aiTimer = 0;
                    this.aiChangeDirection = 60 + Math.random() * 60;
                    
                    const directions = ['up', 'down', 'left', 'right'];
                    
                    if (player && Math.random() < 0.4) {
                        const dx = player.x - this.x;
                        const dy = player.y - this.y;
                        
                        if (Math.abs(dx) > Math.abs(dy)) {
                            this.direction = dx > 0 ? 'right' : 'left';
                        } else {
                            this.direction = dy > 0 ? 'down' : 'up';
                        }
                    } else {
                        this.direction = directions[Math.floor(Math.random() * directions.length)];
                    }
                }
                
                let dx = 0, dy = 0;
                switch(this.direction) {
                    case 'up': dy = -1; break;
                    case 'down': dy = 1; break;
                    case 'left': dx = -1; break;
                    case 'right': dx = 1; break;
                }
                
                if (!this.move(dx, dy)) {
                    this.aiTimer = this.aiChangeDirection;
                }
                
                if (Math.random() < 0.02) {
                    this.shoot();
                }
            }
            
            update() {
                if (this.bulletCooldown > 0) {
                    this.bulletCooldown--;
                }
                
                if (!this.isPlayer) {
                    this.updateAI();
                }
            }
        }
        
        class Bullet {
            constructor(x, y, direction, isPlayerBullet) {
                this.x = x;
                this.y = y;
                this.width = 6;
                this.height = 6;
                this.direction = direction;
                this.speed = 5;
                this.isPlayerBullet = isPlayerBullet;
                this.active = true;
            }
            
            draw() {
                ctx.fillStyle = this.isPlayerBullet ? '#FFD700' : '#FF5722';
                ctx.beginPath();
                ctx.arc(this.x + this.width / 2, this.y + this.height / 2, this.width / 2, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = this.isPlayerBullet ? '#FFF' : '#FFCDD2';
                ctx.beginPath();
                ctx.arc(this.x + this.width / 2, this.y + this.height / 2, this.width / 4, 0, Math.PI * 2);
                ctx.fill();
            }
            
            update() {
                switch(this.direction) {
                    case 'up': this.y -= this.speed; break;
                    case 'down': this.y += this.speed; break;
                    case 'left': this.x -= this.speed; break;
                    case 'right': this.x += this.speed; break;
                }
                
                if (this.x < 0 || this.x > canvas.width || 
                    this.y < 0 || this.y > canvas.height) {
                    this.active = false;
                }
            }
            
            checkCollisions() {
                const col = Math.floor((this.x + this.width / 2) / TILE_SIZE);
                const row = Math.floor((this.y + this.height / 2) / TILE_SIZE);
                
                if (row >= 0 && row < MAP_HEIGHT && col >= 0 && col < MAP_WIDTH) {
                    const tile = map[row][col];
                    
                    if (tile === TILE_BRICK) {
                        map[row][col] = TILE_EMPTY;
                        this.active = false;
                        createExplosion(col * TILE_SIZE + TILE_SIZE / 2, 
                                       row * TILE_SIZE + TILE_SIZE / 2, 'small');
                        return;
                    }
                    
                    if (tile === TILE_STEEL) {
                        this.active = false;
                        createExplosion(this.x, this.y, 'small');
                        return;
                    }
                    
                    if (tile === TILE_BASE) {
                        baseDestroyed = true;
                        map[row][col] = TILE_EMPTY;
                        this.active = false;
                        createExplosion(col * TILE_SIZE + TILE_SIZE / 2, 
                                       row * TILE_SIZE + TILE_SIZE / 2, 'large');
                        return;
                    }
                }
                
                if (this.isPlayerBullet) {
                    for (let i = enemies.length - 1; i >= 0; i--) {
                        if (this.collidesWithTank(enemies[i])) {
                            const enemy = enemies[i];
                            enemies.splice(i, 1);
                            this.active = false;
                            score += 100;
                            enemiesRemaining--;
                            createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, 'large');
                            updateUI();
                            break;
                        }
                    }
                } else {
                    if (player && this.collidesWithTank(player)) {
                        this.active = false;
                        lives--;
                        createExplosion(player.x + player.width / 2, player.y + player.height / 2, 'large');
                        
                        if (lives <= 0) {
                            player = null;
                        } else {
                            player.x = 9 * TILE_SIZE;
                            player.y = 19 * TILE_SIZE;
                            player.direction = 'up';
                        }
                        updateUI();
                    }
                }
            }
            
            collidesWithTank(tank) {
                return this.x < tank.x + tank.width &&
                       this.x + this.width > tank.x &&
                       this.y < tank.y + tank.height &&
                       this.y + this.height > tank.y;
            }
        }
        
        class Explosion {
            constructor(x, y, size) {
                this.x = x;
                this.y = y;
                this.size = size;
                this.radius = size === 'large' ? 30 : 15;
                this.maxRadius = this.radius;
                this.frame = 0;
                this.maxFrames = 15;
                this.active = true;
            }
            
            draw() {
                const progress = this.frame / this.maxFrames;
                const currentRadius = this.maxRadius * (1 - progress * 0.5);
                const alpha = 1 - progress;
                
                ctx.save();
                ctx.globalAlpha = alpha;
                
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, currentRadius);
                gradient.addColorStop(0, '#fff');
                gradient.addColorStop(0.3, '#ffeb3b');
                gradient.addColorStop(0.6, '#ff9800');
                gradient.addColorStop(1, '#f44336');
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, currentRadius, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
            
            update() {
                this.frame++;
                if (this.frame >= this.maxFrames) {
                    this.active = false;
                }
            }
        }
        
        function createExplosion(x, y, size) {
            explosions.push(new Explosion(x, y, size));
        }
        
        function loadMap(levelIndex) {
            const mapData = maps[levelIndex % maps.length];
            map = [];
            
            for (let row = 0; row < MAP_HEIGHT; row++) {
                map[row] = [];
                for (let col = 0; col < MAP_WIDTH; col++) {
                    map[row][col] = parseInt(mapData[row][col]);
                }
            }
        }
        
        function drawMap() {
            for (let row = 0; row < MAP_HEIGHT; row++) {
                for (let col = 0; col < MAP_WIDTH; col++) {
                    const x = col * TILE_SIZE;
                    const y = row * TILE_SIZE;
                    const tile = map[row][col];
                    
                    switch(tile) {
                        case TILE_BRICK:
                            ctx.fillStyle = '#8B4513';
                            ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                            ctx.fillStyle = '#A0522D';
                            for (let i = 0; i < 4; i++) {
                                for (let j = 0; j < 4; j++) {
                                    if ((i + j) % 2 === 0) {
                                        ctx.fillRect(x + i * 8, y + j * 8, 8, 8);
                                    }
                                }
                            }
                            break;
                            
                        case TILE_STEEL:
                            ctx.fillStyle = '#708090';
                            ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                            ctx.fillStyle = '#A9A9A9';
                            ctx.fillRect(x + 2, y + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                            ctx.fillStyle = '#D3D3D3';
                            ctx.fillRect(x + 4, y + 4, TILE_SIZE / 2 - 4, TILE_SIZE / 2 - 4);
                            ctx.fillRect(x + TILE_SIZE / 2 + 2, y + TILE_SIZE / 2 + 2, TILE_SIZE / 2 - 4, TILE_SIZE / 2 - 4);
                            break;
                            
                        case TILE_WATER:
                            ctx.fillStyle = '#1E90FF';
                            ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                            ctx.fillStyle = '#4169E1';
                            for (let i = 0; i < 3; i++) {
                                ctx.fillRect(x, y + i * 11 + (Date.now() / 100) % 11, TILE_SIZE, 3);
                            }
                            break;
                            
                        case TILE_GRASS:
                            ctx.fillStyle = '#228B22';
                            ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                            ctx.fillStyle = '#32CD32';
                            for (let i = 0; i < 8; i++) {
                                ctx.fillRect(x + Math.random() * TILE_SIZE, y + Math.random() * TILE_SIZE, 4, 8);
                            }
                            break;
                            
                        case TILE_BASE:
                            ctx.fillStyle = '#FFD700';
                            ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                            ctx.fillStyle = '#FFA500';
                            ctx.beginPath();
                            ctx.moveTo(x + TILE_SIZE / 2, y + 4);
                            ctx.lineTo(x + TILE_SIZE - 4, y + TILE_SIZE - 4);
                            ctx.lineTo(x + 4, y + TILE_SIZE - 4);
                            ctx.closePath();
                            ctx.fill();
                            ctx.fillStyle = '#FF4500';
                            ctx.font = 'bold 16px Arial';
                            ctx.textAlign = 'center';
                            ctx.fillText('★', x + TILE_SIZE / 2, y + TILE_SIZE / 2 + 6);
                            break;
                    }
                }
            }
        }
        
        function drawBackground() {
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        
        function spawnEnemy() {
            if (enemies.length < maxEnemiesOnScreen && enemiesRemaining > 0) {
                const spawnPoints = [
                    { x: 0, y: 0 },
                    { x: 9 * TILE_SIZE, y: 0 },
                    { x: 19 * TILE_SIZE, y: 0 }
                ];
                
                const spawn = spawnPoints[Math.floor(Math.random() * spawnPoints.length)];
                
                let canSpawn = true;
                for (let enemy of enemies) {
                    if (Math.abs(enemy.x - spawn.x) < TILE_SIZE * 2 && 
                        Math.abs(enemy.y - spawn.y) < TILE_SIZE * 2) {
                        canSpawn = false;
                        break;
                    }
                }
                
                if (canSpawn) {
                    enemies.push(new Tank(spawn.x, spawn.y, 'down', false));
                }
            }
        }
        
        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('enemies').textContent = enemiesRemaining;
            
            const livesContainer = document.getElementById('lives');
            livesContainer.innerHTML = '';
            for (let i = 0; i < lives; i++) {
                const life = document.createElement('div');
                life.className = 'life-icon';
                livesContainer.appendChild(life);
            }
        }
        
        function checkWinCondition() {
            if (enemiesRemaining <= 0 && enemies.length === 0) {
                level++;
                initLevel();
            }
        }
        
        function checkLoseCondition() {
            if (baseDestroyed || lives <= 0) {
                gameState = 'gameover';
                showGameOver(false);
            }
        }
        
        function showGameOver(won) {
            const screen = document.getElementById('gameOverScreen');
            const title = document.getElementById('gameOverTitle');
            const finalScore = document.getElementById('finalScore');
            const message = document.getElementById('gameOverMessage');
            
            screen.classList.remove('hidden');
            title.textContent = won ? '🎉 胜利！' : '💔 游戏结束';
            finalScore.textContent = `最终得分: ${score}`;
            
            if (baseDestroyed) {
                message.textContent = '基地被摧毁了！';
            } else if (lives <= 0) {
                message.textContent = '你牺牲了！';
            } else {
                message.textContent = `恭喜通过第 ${level} 关！`;
            }
        }
        
        function initLevel() {
            loadMap(level - 1);
            
            player = new Tank(9 * TILE_SIZE, 19 * TILE_SIZE, 'up', true);
            enemies = [];
            bullets = [];
            explosions = [];
            baseDestroyed = false;
            enemiesRemaining = 5 + level * 2;
            enemySpawnTimer = 0;
            
            updateUI();
        }
        
        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            gameState = 'playing';
            score = 0;
            level = 1;
            lives = 3;
            initLevel();
            gameLoop();
        }
        
        function restartGame() {
            document.getElementById('gameOverScreen').classList.add('hidden');
            gameState = 'playing';
            score = 0;
            level = 1;
            lives = 3;
            initLevel();
            gameLoop();
        }
        
        const keys = {};
        
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            
            if (e.code === 'Space' && player && gameState === 'playing') {
                player.shoot();
            }
            
            if (e.code === 'KeyP' && gameState === 'playing') {
                isPaused = !isPaused;
            }
            
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
                e.preventDefault();
            }
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });
        
        function handleInput() {
            if (!player || isPaused) return;
            
            let dx = 0, dy = 0;
            
            if (keys['ArrowUp'] || keys['KeyW']) {
                player.direction = 'up';
                dy = -1;
            } else if (keys['ArrowDown'] || keys['KeyS']) {
                player.direction = 'down';
                dy = 1;
            } else if (keys['ArrowLeft'] || keys['KeyA']) {
                player.direction = 'left';
                dx = -1;
            } else if (keys['ArrowRight'] || keys['KeyD']) {
                player.direction = 'right';
                dx = 1;
            }
            
            if (dx !== 0 || dy !== 0) {
                player.move(dx, dy);
            }
        }
        
        function update() {
            if (isPaused || gameState !== 'playing') return;
            
            handleInput();
            
            if (player) {
                player.update();
            }
            
            for (let enemy of enemies) {
                enemy.update();
            }
            
            for (let bullet of bullets) {
                bullet.update();
                bullet.checkCollisions();
            }
            
            bullets = bullets.filter(b => b.active);
            
            for (let explosion of explosions) {
                explosion.update();
            }
            explosions = explosions.filter(e => e.active);
            
            enemySpawnTimer++;
            if (enemySpawnTimer >= enemySpawnInterval) {
                enemySpawnTimer = 0;
                spawnEnemy();
            }
            
            checkWinCondition();
            checkLoseCondition();
        }
        
        function draw() {
            drawBackground();
            drawMap();
            
            if (player) {
                player.draw();
            }
            
            for (let enemy of enemies) {
                enemy.draw();
            }
            
            for (let bullet of bullets) {
                bullet.draw();
            }
            
            for (let explosion of explosions) {
                explosion.draw();
            }
            
            if (isPaused) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#FFD700';
                ctx.font = 'bold 48px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('暂停', canvas.width / 2, canvas.height / 2);
                ctx.font = '24px Arial';
                ctx.fillStyle = '#FFF';
                ctx.fillText('按 P 继续', canvas.width / 2, canvas.height / 2 + 40);
            }
        }
        
        function gameLoop() {
            if (gameState === 'playing') {
                update();
                draw();
                requestAnimationFrame(gameLoop);
            }
        }
        
        updateUI();
    </script>
</body>
</html>
