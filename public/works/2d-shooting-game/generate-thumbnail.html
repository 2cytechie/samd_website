<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生成缩略图</title>
    <style>
        body {
            background: #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        canvas {
            border: 2px solid #333;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <canvas id="thumbnail" width="800" height="600"></canvas>
    <button onclick="saveThumbnail()">保存为 PNG</button>
    
    <script>
        const canvas = document.getElementById('thumbnail');
        const ctx = canvas.getContext('2d');
        
        // 背景
        ctx.fillStyle = '#2b2b2b';
        ctx.fillRect(0, 0, 800, 600);
        
        // 画几个红色靶子
        const targets = [
            { x: 150, y: 150, size: 22 },
            { x: 650, y: 150, size: 22 },
            { x: 400, y: 200, size: 22 },
            { x: 200, y: 400, size: 22 },
            { x: 600, y: 450, size: 22 },
            { x: 400, y: 500, size: 22 }
        ];
        targets.forEach(t => {
            ctx.fillStyle = '#ff4444';
            ctx.beginPath();
            ctx.arc(t.x, t.y, t.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#222';
            ctx.beginPath();
            ctx.arc(t.x, t.y, t.size * 0.4, 0, Math.PI * 2);
            ctx.fill();
        });
        
        // 画玩家（蓝色圆形）
        const playerX = 400;
        const playerY = 300;
        const playerSize = 18;
        ctx.fillStyle = '#42a5f5';
        ctx.beginPath();
        ctx.arc(playerX, playerY, playerSize, 0, Math.PI * 2);
        ctx.fill();
        
        // 画射击方向线
        const angle = -Math.PI / 4;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(playerX, playerY);
        ctx.lineTo(playerX + Math.cos(angle) * 28, playerY + Math.sin(angle) * 28);
        ctx.stroke();
        
        // 画标题
        ctx.font = 'bold 48px Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#fff';
        ctx.shadowColor = '#000';
        ctx.shadowBlur = 10;
        ctx.fillText('2D 射击游戏', 400, 50);
        ctx.shadowBlur = 0;
        
        // 保存为 PNG
        function saveThumbnail() {
            const link = document.createElement('a');
            link.download = '2d-shooting-game-thumbnail.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
