<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>霓虹画板 - Neon Artboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #f0f0ff;
      font-family: 'Courier New', 'Lucida Console', monospace;
      min-height: 100vh;
      overflow: hidden;
    }
    .screen { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100vh; }
    .screen.active { display: flex; }

    /* ==================== 欢迎页样式 ==================== */
    #welcomeScreen {
      background: radial-gradient(ellipse at 50% 40%, #1a0a2e 0%, #0a0a0f 70%);
      overflow-y: auto;
      padding: 20px;
    }
    .welcome-header {
      text-align: center;
      margin-bottom: 30px;
      padding-top: 20px;
    }
    .welcome-title {
      font-family: 'Impact', 'Arial Narrow', Arial, sans-serif;
      font-size: clamp(36px, 8vw, 72px);
      letter-spacing: 0.05em;
      background: linear-gradient(135deg, #fff 0%, #ff88ff 40%, #88ffff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 30px rgba(255, 136, 255, 0.6));
      animation: logoFlicker 4s ease-in-out infinite;
    }
    @keyframes logoFlicker {
      0%,100% { filter: drop-shadow(0 0 30px rgba(255,136,255,0.6)); }
      50%      { filter: drop-shadow(0 0 50px rgba(136,255,255,0.9)); }
    }
    .welcome-subtitle {
      color: #8888cc;
      font-size: 14px;
      letter-spacing: 0.2em;
      margin-top: 10px;
    }
    .start-btn {
      margin-top: 20px;
      font-family: 'Impact', 'Arial Narrow', Arial, sans-serif;
      font-size: 24px;
      letter-spacing: 0.15em;
      padding: 14px 56px;
      background: linear-gradient(135deg, #ff88ff, #88ffff);
      border: none;
      border-radius: 4px;
      color: #000;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
      box-shadow: 0 0 30px rgba(255,136,255,0.5), 0 4px 0 #aa44aa;
    }
    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 50px rgba(136,255,255,0.7), 0 6px 0 #aa44aa;
    }
    .community-section {
      width: 100%;
      max-width: 1100px;
      margin-top: 40px;
    }
    .section-title {
      font-size: 18px;
      letter-spacing: 0.2em;
      color: #ff88ff;
      text-align: center;
      margin-bottom: 20px;
    }
    .artwork-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .artwork-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid #222244;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .artwork-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 30px rgba(255,136,255,0.3);
    }
    .artwork-thumbnail {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      background: #1a1a28;
    }
    .artwork-info {
      padding: 12px;
    }
    .artwork-title {
      font-size: 14px;
      color: #fff;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .artwork-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #8888aa;
    }
    .like-btn {
      background: transparent;
      border: none;
      color: #ff4466;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: transform 0.1s;
    }
    .like-btn:hover {
      transform: scale(1.1);
    }
    .like-btn.liked {
      animation: heartBeat 0.3s ease-out;
    }
    @keyframes heartBeat {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 40px;
    }
    .page-btn {
      background: transparent;
      border: 1px solid #88ffff;
      color: #88ffff;
      padding: 8px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-family: monospace;
      transition: all 0.2s;
    }
    .page-btn:hover:not(:disabled) {
      background: rgba(136,255,255,0.2);
    }
    .page-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .page-info {
      color: #8888aa;
      font-size: 14px;
    }
    .loading {
      color: #88ffff;
      text-align: center;
      padding: 40px;
    }
    .empty-state {
      text-align: center;
      color: #666688;
      padding: 60px 20px;
    }

    /* ==================== 创作页样式 ==================== */
    #studioScreen {
      background: #050508;
      position: relative;
    }
    #canvas {
      background: #0a0a0f;
      cursor: crosshair;
    }
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: linear-gradient(to bottom, rgba(5,5,15,0.95), transparent);
      pointer-events: none;
      z-index: 10;
    }
    .top-bar * { pointer-events: auto; }
    .top-bar-left, .top-bar-right {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .action-btn {
      background: transparent;
      border: 1px solid #88ffff;
      color: #88ffff;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-family: monospace;
      font-size: 12px;
      transition: all 0.2s;
    }
    .action-btn:hover {
      background: rgba(136,255,255,0.2);
    }
    .action-btn.primary {
      border-color: #ff88ff;
      color: #ff88ff;
    }
    .action-btn.primary:hover {
      background: rgba(255,136,255,0.2);
    }
    .toolbar {
      position: absolute;
      right: 12px;
      top: 70px;
      bottom: 20px;
      width: 200px;
      background: rgba(5,5,15,0.95);
      border: 1px solid #222244;
      border-radius: 8px;
      padding: 16px;
      overflow-y: auto;
      z-index: 10;
    }
    .tool-section {
      margin-bottom: 24px;
    }
    .section-label {
      font-size: 10px;
      letter-spacing: 0.2em;
      color: #8888aa;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .tool-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tool-btn {
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.03);
      border: 1px solid #333355;
      border-radius: 6px;
      color: #aaaacc;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.15s;
    }
    .tool-btn:hover {
      border-color: #88ffff;
      color: #88ffff;
    }
    .tool-btn.active {
      background: rgba(136,255,255,0.15);
      border-color: #88ffff;
      color: #88ffff;
      box-shadow: 0 0 15px rgba(136,255,255,0.3);
    }
    .color-picker-row {
      display: flex;
      gap: 8px;
    }
    .color-picker {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
    }
    .color-preset {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.15s;
    }
    .color-preset:hover {
      transform: scale(1.1);
    }
    .slider-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .slider-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #8888aa;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #ff88ff;
    }
    .neon-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .neon-toggle label {
      font-size: 12px;
      color: #aaaacc;
    }
    input[type="checkbox"] {
      accent-color: #ff88ff;
      width: 18px;
      height: 18px;
    }

    /* ==================== 模态框样式 ==================== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal {
      background: #0a0a0f;
      border: 1px solid #ff88ff;
      border-radius: 12px;
      padding: 30px;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 0 40px rgba(255,136,255,0.3);
    }
    .modal-title {
      font-family: 'Impact', 'Arial Narrow', Arial, sans-serif;
      font-size: 24px;
      color: #ff88ff;
      margin-bottom: 20px;
      text-align: center;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.15em;
      color: #8888aa;
      margin-bottom: 8px;
    }
    .form-input {
      width: 100%;
      padding: 12px;
      background: rgba(255,255,255,0.03);
      border: 1px solid #333355;
      border-radius: 6px;
      color: #fff;
      font-family: monospace;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus {
      border-color: #88ffff;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .checkbox-row label {
      font-size: 13px;
      color: #aaaacc;
    }
    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 24px;
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid #666688;
      color: #8888aa;
      padding: 10px 24px;
      border-radius: 4px;
      cursor: pointer;
      font-family: monospace;
      transition: all 0.2s;
    }
    .btn-secondary:hover {
      border-color: #8888aa;
      color: #ccccff;
    }
    .btn-primary {
      background: linear-gradient(135deg, #ff88ff, #88ffff);
      border: none;
      color: #000;
      padding: 10px 28px;
      border-radius: 4px;
      cursor: pointer;
      font-family: monospace;
      font-weight: bold;
      transition: all 0.2s;
    }
    .btn-primary:hover {
      box-shadow: 0 0 30px rgba(255,136,255,0.5);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .view-modal-content {
      text-align: center;
    }
    .view-image {
      max-width: 100%;
      max-height: 60vh;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .view-title {
      font-size: 20px;
      color: #fff;
      margin-bottom: 8px;
    }
    .view-author {
      font-size: 14px;
      color: #8888aa;
      margin-bottom: 16px;
    }
    .message-toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(0,0,0,0.9);
      color: #88ffff;
      padding: 14px 28px;
      border-radius: 8px;
      border: 1px solid #88ffff;
      font-size: 14px;
      z-index: 200;
      transition: transform 0.3s ease-out;
    }
    .message-toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- ==================== 欢迎页 ==================== -->
  <div class="screen active" id="welcomeScreen">
    <div class="welcome-header">
      <h1 class="welcome-title">NEON ARTBOARD</h1>
      <p class="welcome-subtitle">创作并分享你的霓虹画作</p>
      <button class="start-btn" id="startBtn">开始创作 🖌️</button>
    </div>
    <div class="community-section">
      <h2 class="section-title">🔥 热门作品</h2>
      <div class="artwork-grid" id="artworkGrid">
        <div class="loading">加载中...</div>
      </div>
      <div class="pagination" id="pagination" style="display: none;">
        <button class="page-btn" id="prevBtn">← 上一页</button>
        <span class="page-info" id="pageInfo">1 / 1</span>
        <button class="page-btn" id="nextBtn">下一页 →</button>
      </div>
    </div>
  </div>

  <!-- ==================== 创作页 ==================== -->
  <div class="screen" id="studioScreen">
    <canvas id="canvas"></canvas>
    <div class="top-bar">
      <div class="top-bar-left">
        <button class="action-btn" id="backBtn">← 返回</button>
        <button class="action-btn" id="undoBtn">↶ 撤销</button>
        <button class="action-btn" id="redoBtn">↷ 重做</button>
      </div>
      <div class="top-bar-right">
        <button class="action-btn" id="clearBtn">🗑️ 清空</button>
        <button class="action-btn" id="saveBtn">💾 保存</button>
        <button class="action-btn primary" id="shareBtn">✨ 分享</button>
      </div>
    </div>
    <div class="toolbar">
      <div class="tool-section">
        <div class="section-label">工具</div>
        <div class="tool-buttons">
          <button class="tool-btn active" data-tool="brush">🖌️</button>
          <button class="tool-btn" data-tool="airbrush">💨</button>
          <button class="tool-btn" data-tool="marker">🖊️</button>
          <button class="tool-btn" data-tool="eraser">🧽</button>
          <button class="tool-btn" data-tool="line">📏</button>
          <button class="tool-btn" data-tool="circle">⭕</button>
          <button class="tool-btn" data-tool="rect">⬜</button>
        </div>
      </div>
      <div class="tool-section">
        <div class="section-label">颜色</div>
        <div class="color-picker-row" style="margin-bottom: 10px;">
          <input type="color" class="color-picker" id="colorPicker" value="#ff88ff">
          <input type="color" class="color-picker" id="colorPicker2" value="#88ffff">
          <input type="color" class="color-picker" id="colorPicker3" value="#ffff88">
        </div>
        <div class="tool-buttons">
          <div class="color-preset" style="background: #ff88ff;" data-color="#ff88ff"></div>
          <div class="color-preset" style="background: #88ffff;" data-color="#88ffff"></div>
          <div class="color-preset" style="background: #ffff88;" data-color="#ffff88"></div>
          <div class="color-preset" style="background: #88ff88;" data-color="#88ff88"></div>
          <div class="color-preset" style="background: #ff8844;" data-color="#ff8844"></div>
          <div class="color-preset" style="background: #ffffff;" data-color="#ffffff"></div>
        </div>
      </div>
      <div class="tool-section">
        <div class="section-label">设置</div>
        <div class="slider-row">
          <div class="slider-label">
            <span>大小</span>
            <span id="sizeValue">10</span>
          </div>
          <input type="range" id="sizeSlider" min="1" max="60" value="10">
        </div>
        <div class="slider-row" style="margin-top: 14px;">
          <div class="slider-label">
            <span>不透明度</span>
            <span id="opacityValue">100%</span>
          </div>
          <input type="range" id="opacitySlider" min="10" max="100" value="100">
        </div>
        <div class="neon-toggle" style="margin-top: 14px;">
          <input type="checkbox" id="neonToggle" checked>
          <label for="neonToggle">霓虹发光效果</label>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== 分享模态框 ==================== -->
  <div class="modal-overlay" id="shareModal">
    <div class="modal">
      <h3 class="modal-title">✨ 分享到社区</h3>
      <div class="form-group">
        <label class="form-label">作品标题</label>
        <input type="text" class="form-input" id="shareTitle" placeholder="给你的作品起个名字">
      </div>
      <div class="form-group">
        <label class="form-label">你的昵称</label>
        <input type="text" class="form-input" id="shareAuthor" placeholder="输入昵称（可选）">
      </div>
      <div class="form-group">
        <div class="checkbox-row">
          <input type="checkbox" id="anonymousCheck">
          <label for="anonymousCheck">匿名分享</label>
        </div>
      </div>
      <div class="modal-buttons">
        <button class="btn-secondary" id="cancelShareBtn">取消</button>
        <button class="btn-primary" id="confirmShareBtn">确定分享</button>
      </div>
    </div>
  </div>

  <!-- ==================== 查看大图模态框 ==================== -->
  <div class="modal-overlay" id="viewModal">
    <div class="modal" style="max-width: 600px;">
      <div class="view-modal-content">
        <img class="view-image" id="viewImage" src="" alt="作品">
        <h3 class="view-title" id="viewTitle"></h3>
        <p class="view-author" id="viewAuthor"></p>
        <button class="like-btn" id="viewLikeBtn">❤️ <span id="viewLikes">0</span></button>
        <div class="modal-buttons" style="margin-top: 20px; justify-content: center;">
          <button class="btn-secondary" id="closeViewBtn">关闭</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== 消息提示 ==================== -->
  <div class="message-toast" id="toast"></div>

  <script>
    // ==================== 全局变量 ====================
    const API_BASE = 'http://localhost:8001/api';
    let currentPage = 1;
    let totalPages = 1;
    let likedArtworks = new Set();

    // 画板状态
    let canvas, ctx;
    let isDrawing = false;
    let lastX = 0, lastY = 0;
    let history = [];
    let historyIndex = -1;
    let currentTool = 'brush';
    let currentColor = '#ff88ff';
    let brushSize = 10;
    let opacity = 1;
    let neonEnabled = true;
    let isDrawingShape = false;
    let shapeStartX = 0, shapeStartY = 0;

    // ==================== 初始化 ====================
    document.addEventListener('DOMContentLoaded', () => {
      initEventListeners();
      loadArtworks();
    });

    function initEventListeners() {
      // 欢迎页
      document.getElementById('startBtn').addEventListener('click', () => {
        showScreen('studioScreen');
        initCanvas();
      });
      document.getElementById('prevBtn').addEventListener('click', () => {
        if (currentPage > 1) {
          currentPage--;
          loadArtworks();
        }
      });
      document.getElementById('nextBtn').addEventListener('click', () => {
        if (currentPage < totalPages) {
          currentPage++;
          loadArtworks();
        }
      });

      // 创作页
      document.getElementById('backBtn').addEventListener('click', () => {
        showScreen('welcomeScreen');
        loadArtworks();
      });
      document.getElementById('undoBtn').addEventListener('click', undo);
      document.getElementById('redoBtn').addEventListener('click', redo);
      document.getElementById('clearBtn').addEventListener('click', clearCanvas);
      document.getElementById('saveBtn').addEventListener('click', saveImage);
      document.getElementById('shareBtn').addEventListener('click', () => {
        document.getElementById('shareModal').classList.add('active');
      });

      // 工具按钮
      document.querySelectorAll('.tool-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentTool = btn.dataset.tool;
        });
      });

      // 颜色预设
      document.querySelectorAll('.color-preset').forEach(preset => {
        preset.addEventListener('click', () => {
          currentColor = preset.dataset.color;
        });
      });

      // 颜色选择器
      document.getElementById('colorPicker').addEventListener('input', e => {
        currentColor = e.target.value;
      });
      document.getElementById('colorPicker2').addEventListener('input', e => {
        currentColor = e.target.value;
      });
      document.getElementById('colorPicker3').addEventListener('input', e => {
        currentColor = e.target.value;
      });

      // 滑块
      document.getElementById('sizeSlider').addEventListener('input', e => {
        brushSize = parseInt(e.target.value);
        document.getElementById('sizeValue').textContent = brushSize;
      });
      document.getElementById('opacitySlider').addEventListener('input', e => {
        opacity = parseInt(e.target.value) / 100;
        document.getElementById('opacityValue').textContent = e.target.value + '%';
      });

      // 霓虹开关
      document.getElementById('neonToggle').addEventListener('change', e => {
        neonEnabled = e.target.checked;
      });

      // 分享模态框
      document.getElementById('cancelShareBtn').addEventListener('click', () => {
        document.getElementById('shareModal').classList.remove('active');
      });
      document.getElementById('confirmShareBtn').addEventListener('click', shareArtwork);
      document.getElementById('anonymousCheck').addEventListener('change', e => {
        const authorInput = document.getElementById('shareAuthor');
        if (e.target.checked) {
          authorInput.value = '';
          authorInput.disabled = true;
        } else {
          authorInput.disabled = false;
        }
      });

      // 查看模态框
      document.getElementById('closeViewBtn').addEventListener('click', () => {
        document.getElementById('viewModal').classList.remove('active');
      });
      document.getElementById('viewLikeBtn').addEventListener('click', () => {
        const artworkId = document.getElementById('viewModal').dataset.artworkId;
        if (artworkId) likeArtwork(artworkId);
      });

      // 点击遮罩关闭模态框
      document.querySelectorAll('.modal-overlay').forEach(overlay => {
        overlay.addEventListener('click', e => {
          if (e.target === overlay) {
            overlay.classList.remove('active');
          }
        });
      });
    }

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function showToast(message, duration = 3000) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, duration);
    }

    // ==================== 画板功能 ====================
    function initCanvas() {
      canvas = document.getElementById('canvas');
      ctx = canvas.getContext('2d');
      resizeCanvas();

      canvas.addEventListener('mousedown', startDraw);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDraw);
      canvas.addEventListener('mouseleave', stopDraw);
      canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        startDraw(e.touches[0]);
      });
      canvas.addEventListener('touchmove', e => {
        e.preventDefault();
        draw(e.touches[0]);
      });
      canvas.addEventListener('touchend', stopDraw);

      window.addEventListener('resize', resizeCanvas);
      
      clearCanvas();
    }

    function resizeCanvas() {
      if (!canvas) return;
      const container = document.getElementById('studioScreen');
      const toolbarWidth = 220;
      const padding = 40;
      
      canvas.width = Math.min(container.clientWidth - toolbarWidth - padding, 900);
      canvas.height = Math.min(container.clientHeight - padding, 650);
      
      if (history.length > 0) {
        const img = new Image();
        img.onload = () => {
          ctx.drawImage(img, 0, 0);
        };
        img.src = history[historyIndex];
      }
    }

    function getCanvasPos(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX || e.pageX) - rect.left,
        y: (e.clientY || e.pageY) - rect.top
      };
    }

    function startDraw(e) {
      const pos = getCanvasPos(e);
      isDrawing = true;
      lastX = pos.x;
      lastY = pos.y;

      if (['line', 'circle', 'rect'].includes(currentTool)) {
        isDrawingShape = true;
        shapeStartX = pos.x;
        shapeStartY = pos.y;
        saveState();
      } else {
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        saveState();
      }
    }

    function draw(e) {
      if (!isDrawing) return;
      const pos = getCanvasPos(e);

      if (isDrawingShape) {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = canvas.width;
        tempCanvas.height = canvas.height;
        const tempCtx = tempCanvas.getContext('2d');
        const img = new Image();
        img.onload = () => {
          tempCtx.drawImage(img, 0, 0);
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(tempCanvas, 0, 0);
          drawShape(tempCtx, shapeStartX, shapeStartY, pos.x, pos.y);
          ctx.drawImage(tempCanvas, 0, 0);
        };
        img.src = history[historyIndex];
      } else {
        drawStroke(lastX, lastY, pos.x, pos.y);
        lastX = pos.x;
        lastY = pos.y;
      }
    }

    function stopDraw(e) {
      if (!isDrawing) return;
      
      if (isDrawingShape && e) {
        const pos = getCanvasPos(e);
        drawShape(ctx, shapeStartX, shapeStartY, pos.x, pos.y);
      }
      
      isDrawing = false;
      isDrawingShape = false;
      saveState();
    }

    function drawStroke(x1, y1, x2, y2) {
      ctx.globalAlpha = opacity;
      
      if (currentTool === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.strokeStyle = 'rgba(0,0,0,1)';
        ctx.lineWidth = brushSize;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        ctx.globalCompositeOperation = 'source-over';
      } else {
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = currentTool === 'marker' ? brushSize * 1.5 : brushSize;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        if (currentTool === 'airbrush') {
          for (let i = 0; i < 5; i++) {
            const offsetX = (Math.random() - 0.5) * brushSize;
            const offsetY = (Math.random() - 0.5) * brushSize;
            ctx.beginPath();
            ctx.arc(x2 + offsetX, y2 + offsetY, brushSize * 0.3, 0, Math.PI * 2);
            ctx.fillStyle = currentColor;
            ctx.fill();
          }
        } else {
          if (neonEnabled) {
            ctx.shadowColor = currentColor;
            ctx.shadowBlur = 15;
          }
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
          ctx.shadowBlur = 0;
        }
      }
      
      ctx.globalAlpha = 1;
    }

    function drawShape(context, x1, y1, x2, y2) {
      context.globalAlpha = opacity;
      context.strokeStyle = currentColor;
      context.fillStyle = currentColor;
      context.lineWidth = brushSize;
      
      if (neonEnabled) {
        context.shadowColor = currentColor;
        context.shadowBlur = 15;
      }

      const width = x2 - x1;
      const height = y2 - y1;

      if (currentTool === 'line') {
        context.beginPath();
        context.moveTo(x1, y1);
        context.lineTo(x2, y2);
        context.stroke();
      } else if (currentTool === 'circle') {
        const radius = Math.sqrt(width * width + height * height) / 2;
        const centerX = x1 + width / 2;
        const centerY = y1 + height / 2;
        context.beginPath();
        context.arc(centerX, centerY, radius, 0, Math.PI * 2);
        context.stroke();
      } else if (currentTool === 'rect') {
        context.strokeRect(x1, y1, width, height);
      }

      context.shadowBlur = 0;
      context.globalAlpha = 1;
    }

    function saveState() {
      history = history.slice(0, historyIndex + 1);
      history.push(canvas.toDataURL());
      historyIndex = history.length - 1;
      if (history.length > 50) {
        history.shift();
        historyIndex--;
      }
    }

    function undo() {
      if (historyIndex > 0) {
        historyIndex--;
        const img = new Image();
        img.onload = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0);
        };
        img.src = history[historyIndex];
      }
    }

    function redo() {
      if (historyIndex < history.length - 1) {
        historyIndex++;
        const img = new Image();
        img.onload = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0);
        };
        img.src = history[historyIndex];
      }
    }

    function clearCanvas() {
      ctx.fillStyle = '#0a0a0f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      saveState();
    }

    function saveImage() {
      const link = document.createElement('a');
      link.download = 'neon-artwork-' + Date.now() + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
      showToast('作品已保存！');
    }

    function generateThumbnail() {
      const tempCanvas = document.createElement('canvas');
      const tempCtx = tempCanvas.getContext('2d');
      const maxWidth = 400;
      const maxHeight = 300;
      
      let width = canvas.width;
      let height = canvas.height;
      
      if (width > maxWidth) {
        height = (maxWidth / width) * height;
        width = maxWidth;
      }
      if (height > maxHeight) {
        width = (maxHeight / height) * width;
        height = maxHeight;
      }
      
      tempCanvas.width = width;
      tempCanvas.height = height;
      tempCtx.drawImage(canvas, 0, 0, width, height);
      
      return tempCanvas.toDataURL('image/png');
    }

    async function shareArtwork() {
      const title = document.getElementById('shareTitle').value.trim();
      const isAnonymous = document.getElementById('anonymousCheck').checked;
      const author = isAnonymous ? '' : document.getElementById('shareAuthor').value.trim();

      if (!title) {
        showToast('请填写作品标题');
        return;
      }

      const btn = document.getElementById('confirmShareBtn');
      btn.disabled = true;
      btn.textContent = '上传中...';

      try {
        const imageData = canvas.toDataURL('image/png');
        const thumbnailData = generateThumbnail();

        const response = await fetch(`${API_BASE}/artworks`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title,
            author_name: author,
            image_data: imageData,
            thumbnail_data: thumbnailData
          })
        });

        const result = await response.json();
        
        if (result.success) {
          document.getElementById('shareModal').classList.remove('active');
          document.getElementById('shareTitle').value = '';
          document.getElementById('shareAuthor').value = '';
          document.getElementById('anonymousCheck').checked = false;
          showToast('分享成功！🎉');
        } else {
          showToast('分享失败：' + result.error);
        }
      } catch (error) {
        console.error('分享失败:', error);
        showToast('分享失败，请稍后重试');
      } finally {
        btn.disabled = false;
        btn.textContent = '确定分享';
      }
    }

    // ==================== 社区功能 ====================
    async function loadArtworks() {
      const grid = document.getElementById('artworkGrid');
      const pagination = document.getElementById('pagination');
      grid.innerHTML = '<div class="loading">加载中...</div>';
      
      try {
        const response = await fetch(`${API_BASE}/artworks?page=${currentPage}&limit=12`);
        const result = await response.json();

        if (result.success) {
          const { items, pagination: paginationData } = result.data;
          totalPages = paginationData.totalPages;

          if (items.length === 0) {
            grid.innerHTML = '<div class="empty-state">还没有作品，来创作第一个吧！</div>';
          } else {
            grid.innerHTML = items.map(artwork => `
              <div class="artwork-card" data-id="${artwork.id}">
                <img class="artwork-thumbnail" src="${artwork.thumbnail_data}" alt="${artwork.title}" 
                  onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 400 300%22><rect fill=%22%231a1a28%22 width=%22400%22 height=%22300%22/></svg>'">
                <div class="artwork-info">
                  <div class="artwork-title">${escapeHtml(artwork.title)}</div>
                  <div class="artwork-meta">
                    <span>👤 ${escapeHtml(artwork.author_name || '匿名用户')}</span>
                    <button class="like-btn ${likedArtworks.has(artwork.id) ? 'liked' : ''}" data-id="${artwork.id}">
                      ❤️ <span class="like-count">${artwork.likes}</span>
                    </button>
                  </div>
                </div>
              </div>
            `).join('');

            grid.querySelectorAll('.artwork-card').forEach(card => {
              card.addEventListener('click', e => {
                if (e.target.closest('.like-btn')) return;
                viewArtwork(card.dataset.id);
              });
            });

            grid.querySelectorAll('.like-btn').forEach(btn => {
              btn.addEventListener('click', e => {
                e.stopPropagation();
                likeArtwork(btn.dataset.id);
              });
            });
          }

          if (totalPages > 1) {
            pagination.style.display = 'flex';
            document.getElementById('pageInfo').textContent = `${currentPage} / ${totalPages}`;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage === totalPages;
          } else {
            pagination.style.display = 'none';
          }
        } else {
          grid.innerHTML = '<div class="empty-state">加载失败</div>';
        }
      } catch (error) {
        console.error('加载作品失败:', error);
        grid.innerHTML = `
          <div class="empty-state">
            <p style="margin-bottom: 10px;">连接后端失败，请确保后端服务已启动</p>
            <p style="font-size: 12px; color: #666;">你可以先体验画板功能</p>
          </div>
        `;
      }
    }

    async function viewArtwork(id) {
      try {
        const response = await fetch(`${API_BASE}/artworks/${id}`);
        const result = await response.json();

        if (result.success) {
          const artwork = result.data;
          document.getElementById('viewImage').src = artwork.image_data;
          document.getElementById('viewTitle').textContent = artwork.title;
          document.getElementById('viewAuthor').textContent = '作者：' + (artwork.author_name || '匿名用户');
          document.getElementById('viewLikes').textContent = artwork.likes;
          document.getElementById('viewModal').dataset.artworkId = id;
          
          const likeBtn = document.getElementById('viewLikeBtn');
          if (likedArtworks.has(id)) {
            likeBtn.classList.add('liked');
          } else {
            likeBtn.classList.remove('liked');
          }
          
          document.getElementById('viewModal').classList.add('active');
        }
      } catch (error) {
        console.error('获取作品详情失败:', error);
        showToast('加载失败');
      }
    }

    async function likeArtwork(id) {
      if (likedArtworks.has(id)) return;

      try {
        const response = await fetch(`${API_BASE}/artworks/${id}/like`, {
          method: 'POST'
        });
        const result = await response.json();

        if (result.success) {
          likedArtworks.add(id);
          
          document.querySelectorAll(`.like-btn[data-id="${id}"]`).forEach(btn => {
            btn.classList.add('liked');
            const countSpan = btn.querySelector('.like-count');
            if (countSpan) countSpan.textContent = result.data.likes;
          });
          
          if (document.getElementById('viewModal').dataset.artworkId === id) {
            document.getElementById('viewLikes').textContent = result.data.likes;
            document.getElementById('viewLikeBtn').classList.add('liked');
          }
          
          showToast('点赞成功！❤️');
        }
      } catch (error) {
        console.error('点赞失败:', error);
        showToast('点赞失败');
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
