<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生成缩略图</title>
    <style>
        body {
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: monospace;
            color: #fff;
            padding: 20px;
        }
        canvas {
            border: 2px solid #333;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(255, 136, 255, 0.3);
            max-width: 100%;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }
        button {
            padding: 12px 24px;
            font-size: 14px;
            background: linear-gradient(135deg, #ff88ff, #88ffff);
            color: #000;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
            transition: all 0.2s;
        }
        button:hover {
            box-shadow: 0 0 30px rgba(255, 136, 255, 0.6);
            transform: translateY(-2px);
        }
        .info {
            color: #88ffff;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="info">🎨 生成缩略图 - 点击保存为图片</div>
    <canvas id="thumbnail" width="800" height="600"></canvas>
    <div class="controls">
        <button onclick="generate()">重新生成</button>
        <button onclick="saveThumbnail()">保存为 PNG</button>
    </div>

    <script>
        const canvas = document.getElementById('thumbnail');
        const ctx = canvas.getContext('2d');

        function drawMandala(x, y, size, color, alpha, symmetry) {
            ctx.save();
            ctx.translate(x, y);
            ctx.globalAlpha = alpha;
            
            for (let s = 0; s < symmetry; s++) {
                ctx.save();
                ctx.rotate((s / symmetry) * Math.PI * 2);
                
                for (let i = 0; i < 3; i++) {
                    ctx.fillStyle = color;
                    ctx.shadowColor = color;
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.arc(size * (0.5 + i * 0.4), 0, size * (0.2 + i * 0.15), 0, Math.PI * 2);
                    ctx.fill();
                }
                
                ctx.restore();
            }
            ctx.restore();
        }

        function drawSpiral(x, y, size, color, alpha) {
            ctx.save();
            ctx.translate(x, y);
            ctx.globalAlpha = alpha;
            ctx.strokeStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = 10;
            ctx.lineWidth = size * 0.3;
            ctx.lineCap = 'round';
            
            ctx.beginPath();
            for (let t = 0; t < Math.PI * 6; t += 0.1) {
                const r = t * size * 0.15;
                const px = Math.cos(t) * r;
                const py = Math.sin(t) * r;
                if (t === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.stroke();
            ctx.restore();
        }

        function drawCrystal(x, y, size, color, alpha) {
            ctx.save();
            ctx.translate(x, y);
            ctx.globalAlpha = alpha;
            ctx.strokeStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = 15;
            ctx.lineWidth = 2;
            
            for (let layer = 0; layer < 3; layer++) {
                ctx.save();
                ctx.globalAlpha = alpha * (1 - layer * 0.2);
                ctx.beginPath();
                const points = 6;
                for (let i = 0; i < points; i++) {
                    const angle = (i / points) * Math.PI * 2;
                    const r = size * (0.4 + layer * 0.35) * (0.9 + Math.random() * 0.2);
                    const px = Math.cos(angle) * r;
                    const py = Math.sin(angle) * r;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.stroke();
                ctx.restore();
            }
            ctx.restore();
        }

        function generate() {
            // Background gradient
            const gradient = ctx.createRadialGradient(400, 300, 0, 400, 300, 600);
            gradient.addColorStop(0, '#1a0a2e');
            gradient.addColorStop(1, '#0a0a0f');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 800, 600);

            // Draw various elements
            const colors = ['#ff88ff', '#88ffff', '#ffff88', '#88ff88'];
            
            // Mandalas
            drawMandala(160, 160, 60, colors[0], 0.8, 12);
            drawMandala(640, 440, 70, colors[1], 0.7, 8);
            
            // Spirals
            drawSpiral(640, 160, 50, colors[2], 0.9);
            drawSpiral(160, 440, 56, colors[3], 0.8);
            
            // Crystals
            drawCrystal(400, 300, 80, colors[0], 0.6);
            drawCrystal(400, 300, 50, colors[1], 0.7);
            
            // Title overlay
            ctx.save();
            ctx.globalAlpha = 0.95;
            ctx.shadowColor = '#ff88ff';
            ctx.shadowBlur = 25;
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 64px Impact, Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('NEON ARTBOARD', 400, 280);
            
            ctx.fillStyle = '#88ffff';
            ctx.shadowColor = '#88ffff';
            ctx.font = '24px monospace';
            ctx.fillText('创作 & 分享', 400, 340);
            ctx.restore();
        }

        function saveThumbnail() {
            const link = document.createElement('a');
            link.download = 'artboard-thumbnail.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        generate();
    </script>
</body>
</html>
