<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generative Art Studio</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background:#0a0a0f;
  color:#f0f0ff;
  font-family:'Courier New','Lucida Console',monospace;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  overflow:hidden;
  user-select:none;
}

.screen { display:none; flex-direction:column; align-items:center; justify-content:center; width:100%; min-height:100vh; }
.screen.active { display:flex; }

#titleScreen {
  background: radial-gradient(ellipse at 50% 40%, #1a0a2e 0%, #0a0a0f 70%);
  gap:20px;
  overflow-y:auto;
  padding:20px;
}

.title-logo {
  font-family:'Impact','Arial Narrow',Arial,sans-serif;
  font-size:clamp(28px,6vw,72px);
  letter-spacing:0.05em;
  line-height:1.0;
  text-align:center;
  background:linear-gradient(135deg,#fff 0%,#ff88ff 40%,#88ffff 70%,#ffff88 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  filter:drop-shadow(0 0 30px rgba(255,136,255,0.6));
  animation:logoFlicker 4s ease-in-out infinite;
}
@keyframes logoFlicker {
  0%,100% { filter:drop-shadow(0 0 30px rgba(255,136,255,0.6)); }
  50%      { filter:drop-shadow(0 0 50px rgba(136,255,255,0.9)); }
}

.title-sub {
  font-family:'Courier New','Lucida Console',monospace;
  font-size:clamp(9px,1.5vw,13px);
  letter-spacing:0.4em;
  color:#ff88ff;
  margin-bottom:30px;
}

.presets {
  display:flex;
  gap:15px;
  flex-wrap:wrap;
  justify-content:center;
  max-width:700px;
  margin-bottom:30px;
}

.preset-btn {
  font-family:'Courier New','Lucida Console',monospace;
  font-size:12px;
  padding:12px 20px;
  background:transparent;
  border:1px solid #ff88ff;
  border-radius:6px;
  color:#ff88ff;
  cursor:pointer;
  transition:all 0.2s;
}
.preset-btn:hover {
  background:rgba(255,136,255,0.2);
  transform:translateY(-2px);
  box-shadow:0 0 20px rgba(255,136,255,0.4);
}

.btn-start {
  font-family:'Impact','Arial Narrow',Arial,sans-serif;
  font-size:26px;
  letter-spacing:0.15em;
  padding:14px 56px;
  background:linear-gradient(135deg,#ff88ff,#88ffff);
  border:none;
  border-radius:4px;
  color:#000;
  cursor:pointer;
  transition:transform 0.1s,box-shadow 0.1s;
  box-shadow:0 0 30px rgba(255,136,255,0.5),0 4px 0 #aa44aa;
}
.btn-start:hover { transform:translateY(-2px); box-shadow:0 0 50px rgba(136,255,255,0.7),0 6px 0 #aa44aa; }

#studioScreen { position:relative; padding:0; background:#050508; }
#canvas { display:block; background:#0a0a0f; }

#controls {
  position:absolute;
  top:0; left:0; right:0;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  padding:15px;
  background:linear-gradient(to bottom,rgba(5,5,15,0.95),transparent);
  pointer-events:none;
  flex-wrap:wrap;
  gap:15px;
}

.control-group {
  display:flex;
  flex-direction:column;
  gap:8px;
  pointer-events:auto;
}

.control-label {
  font-size:10px;
  letter-spacing:0.2em;
  color:#8888aa;
  text-transform:uppercase;
}

.control-row {
  display:flex;
  gap:10px;
  align-items:center;
}

input[type="range"] {
  width:120px;
  accent-color:#ff88ff;
}

.color-picker {
  width:40px;
  height:25px;
  border:none;
  border-radius:4px;
  cursor:pointer;
  background:transparent;
}

.action-btn {
  font-family:'Courier New','Lucida Console',monospace;
  font-size:11px;
  padding:8px 16px;
  background:transparent;
  border:1px solid #88ffff;
  border-radius:4px;
  color:#88ffff;
  cursor:pointer;
  transition:all 0.2s;
  pointer-events:auto;
}
.action-btn:hover {
  background:rgba(136,255,255,0.2);
}
.action-btn.primary {
  border-color:#ff88ff;
  color:#ff88ff;
}
.action-btn.primary:hover {
  background:rgba(255,136,255,0.2);
}

#modeIndicator {
  position:absolute;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  font-size:11px;
  color:#666688;
  letter-spacing:0.2em;
  background:rgba(0,0,0,0.5);
  padding:8px 20px;
  border-radius:20px;
}

#stats {
  position:absolute;
  bottom:15px;
  right:15px;
  font-size:11px;
  color:#8888aa;
  text-align:right;
}
</style>
</head>
<body>

<div class="screen active" id="titleScreen">
  <div class="title-logo">GENERATIVE ART</div>
  <div class="title-sub">CREATE BEAUTY WITH CODE</div>
  
  <div class="presets">
    <button class="preset-btn" data-preset="mandala">🌸 MANDALA</button>
    <button class="preset-btn" data-preset="spiral">🌀 SPIRAL</button>
    <button class="preset-btn" data-preset="fractal">❄️ FRACTAL</button>
    <button class="preset-btn" data-preset="flow">🌊 FLOW</button>
    <button class="preset-btn" data-preset="crystal">💎 CRYSTAL</button>
    <button class="preset-btn" data-preset="noise">🌌 NOISE</button>
  </div>

  <button class="btn-start" id="btnStart">START CREATING</button>
</div>

<div class="screen" id="studioScreen">
  <canvas id="canvas"></canvas>
  <div id="controls">
    <div class="control-group">
      <div class="control-label">MODE</div>
      <div class="control-row">
        <button class="action-btn" id="btnMode">DRAW</button>
      </div>
    </div>
    <div class="control-group">
      <div class="control-label">COLORS</div>
      <div class="control-row">
        <input type="color" class="color-picker" id="color1" value="#ff88ff">
        <input type="color" class="color-picker" id="color2" value="#88ffff">
        <input type="color" class="color-picker" id="color3" value="#ffff88">
      </div>
    </div>
    <div class="control-group">
      <div class="control-label">SIZE</div>
      <div class="control-row">
        <input type="range" id="sizeSlider" min="1" max="50" value="10">
      </div>
    </div>
    <div class="control-group">
      <div class="control-label">DENSITY</div>
      <div class="control-row">
        <input type="range" id="densitySlider" min="1" max="20" value="5">
      </div>
    </div>
    <div class="control-group">
      <div class="control-label">ACTIONS</div>
      <div class="control-row">
        <button class="action-btn primary" id="btnRandom">RANDOMIZE</button>
        <button class="action-btn" id="btnClear">CLEAR</button>
        <button class="action-btn" id="btnSave">SAVE</button>
      </div>
    </div>
  </div>
  <div id="modeIndicator">CLICK & DRAG TO DRAW</div>
  <div id="stats">ELEMENTS: 0</div>
</div>

<script>
var canvas = document.getElementById('canvas');
var ctx = canvas.getContext('2d');

var animId = null;
var lastTime = 0;
var elements = [];
var particles = [];

var currentPreset = 'mandala';
var mode = 'draw';
var isDrawing = false;
var lastX = 0, lastY = 0;

var config = {
  color1: '#ff88ff',
  color2: '#88ffff',
  color3: '#ffff88',
  size: 10,
  density: 5,
  symmetry: 6
};

var presets = {
  mandala: { symmetry: 12, size: 8, density: 8 },
  spiral: { symmetry: 1, size: 5, density: 10 },
  fractal: { symmetry: 3, size: 3, density: 15 },
  flow: { symmetry: 1, size: 8, density: 6 },
  crystal: { symmetry: 6, size: 6, density: 12 },
  noise: { symmetry: 2, size: 10, density: 4 }
};

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}

function resizeCanvas() {
  var W = Math.max(600, Math.min(window.innerWidth,  950));
  var H = Math.max(440, Math.min(window.innerHeight, 700));
  canvas.width = W;
  canvas.height = H;
}

function initStudio() {
  resizeCanvas();
  elements = [];
  particles = [];
  drawBackground();
  updateStats();
}

function drawBackground() {
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  var k = function(n) { return (n + h / 30) % 12; };
  var a = s * Math.min(l, 1 - l);
  var f = function(n) {
    return l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  };
  var toHex = function(x) {
    var hex = Math.round(x * 255).toString(16);
    return hex.length === 1 ? '0' + hex : hex;
  };
  return '#' + toHex(f(0)) + toHex(f(8)) + toHex(f(4));
}

function lerpColor(color1, color2, t) {
  var c1 = parseInt(color1.slice(1), 16);
  var c2 = parseInt(color2.slice(1), 16);
  var r1 = (c1 >> 16) & 255, g1 = (c1 >> 8) & 255, b1 = c1 & 255;
  var r2 = (c2 >> 16) & 255, g2 = (c2 >> 8) & 255, b2 = c2 & 255;
  var r = Math.round(r1 + (r2 - r1) * t);
  var g = Math.round(g1 + (g2 - g1) * t);
  var b = Math.round(b1 + (b2 - b1) * t);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function getRandomColor() {
  var colors = [config.color1, config.color2, config.color3];
  return colors[Math.floor(Math.random() * colors.length)];
}

function addElement(x, y, type) {
  var element = {
    x: x,
    y: y,
    type: type,
    color: getRandomColor(),
    size: config.size * (0.5 + Math.random() * 1),
    rotation: Math.random() * Math.PI * 2,
    alpha: 0.6 + Math.random() * 0.4,
    growth: 0,
    maxGrowth: 1 + Math.random() * 2
  };
  elements.push(element);
  
  for (var i = 0; i < config.density; i++) {
    addParticle(x, y, element.color);
  }
}

function addParticle(x, y, color) {
  var angle = Math.random() * Math.PI * 2;
  var speed = 20 + Math.random() * 80;
  particles.push({
    x: x,
    y: y,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    color: color,
    size: 1 + Math.random() * 3,
    life: 0.5 + Math.random() * 1,
    maxLife: 0.5 + Math.random() * 1
  });
}

function drawMandala(x, y, size, color, alpha) {
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = alpha;
  
  for (var s = 0; s < config.symmetry; s++) {
    ctx.save();
    ctx.rotate((s / config.symmetry) * Math.PI * 2);
    
    for (var i = 0; i < 3; i++) {
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(size * (0.5 + i * 0.4), 0, size * (0.2 + i * 0.15), 0, Math.PI * 2);
      ctx.fill();
    }
    
    ctx.restore();
  }
  ctx.restore();
}

function drawSpiral(x, y, size, color, alpha) {
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 10;
  ctx.lineWidth = size * 0.3;
  ctx.lineCap = 'round';
  
  ctx.beginPath();
  for (var t = 0; t < Math.PI * 8; t += 0.1) {
    var r = t * size * 0.15;
    var px = Math.cos(t) * r;
    var py = Math.sin(t) * r;
    if (t === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.stroke();
  ctx.restore();
}

function drawFractal(x, y, size, color, alpha, depth) {
  if (depth === undefined) depth = 0;
  if (depth > 4) return;
  
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = alpha * (1 - depth * 0.15);
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 5;
  
  ctx.beginPath();
  for (var i = 0; i < 6; i++) {
    var angle = (i / 6) * Math.PI * 2 - Math.PI / 2;
    var px = Math.cos(angle) * size;
    var py = Math.sin(angle) * size;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
  
  if (depth < 4) {
    for (var i = 0; i < 6; i++) {
      var angle = (i / 6) * Math.PI * 2 - Math.PI / 2;
      var nx = Math.cos(angle) * size * 1.2;
      var ny = Math.sin(angle) * size * 1.2;
      drawFractal(nx, ny, size * 0.45, color, alpha, depth + 1);
    }
  }
  ctx.restore();
}

function drawFlow(x, y, size, color, alpha) {
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 15;
  
  for (var i = 0; i < 8; i++) {
    var angle = (i / 8) * Math.PI * 2;
    var len = size * (1 + Math.random() * 0.5);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(
      Math.cos(angle + 0.5) * len * 0.5,
      Math.sin(angle + 0.5) * len * 0.5,
      Math.cos(angle) * len,
      Math.sin(angle) * len
    );
    ctx.lineWidth = size * 0.2;
    ctx.strokeStyle = color;
    ctx.stroke();
  }
  ctx.restore();
}

function drawCrystal(x, y, size, color, alpha) {
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 15;
  ctx.lineWidth = 2;
  
  for (var layer = 0; layer < 3; layer++) {
    ctx.save();
    ctx.globalAlpha = alpha * (1 - layer * 0.2);
    ctx.beginPath();
    var points = 6;
    for (var i = 0; i < points; i++) {
      var angle = (i / points) * Math.PI * 2;
      var r = size * (0.4 + layer * 0.35) * (0.8 + Math.random() * 0.4);
      var px = Math.cos(angle) * r;
      var py = Math.sin(angle) * r;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

function drawNoise(x, y, size, color, alpha) {
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = alpha;
  
  for (var i = 0; i < 20; i++) {
    var angle = Math.random() * Math.PI * 2;
    var dist = Math.random() * size;
    var px = Math.cos(angle) * dist;
    var py = Math.sin(angle) * dist;
    var dotSize = size * 0.1 * (0.5 + Math.random());
    
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(px, py, dotSize, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function getCanvasPos(e) {
  var rect = canvas.getBoundingClientRect();
  var clientX = e.touches ? e.touches[0].clientX : e.clientX;
  var clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: clientX - rect.left,
    y: clientY - rect.top
  };
}

function handleDrawStart(e) {
  e.preventDefault();
  isDrawing = true;
  var pos = getCanvasPos(e);
  lastX = pos.x;
  lastY = pos.y;
  drawAt(pos.x, pos.y);
}

function handleDrawMove(e) {
  if (!isDrawing) return;
  e.preventDefault();
  var pos = getCanvasPos(e);
  
  var dx = pos.x - lastX;
  var dy = pos.y - lastY;
  var dist = Math.sqrt(dx * dx + dy * dy);
  var steps = Math.max(1, Math.floor(dist / config.size));
  
  for (var i = 0; i < steps; i++) {
    var t = i / steps;
    var x = lastX + dx * t;
    var y = lastY + dy * t;
    drawAt(x, y);
  }
  
  lastX = pos.x;
  lastY = pos.y;
}

function handleDrawEnd() {
  isDrawing = false;
}

function drawAt(x, y) {
  var color = getRandomColor();
  var size = config.size * (0.8 + Math.random() * 0.4);
  var alpha = 0.5 + Math.random() * 0.5;
  
  switch (currentPreset) {
    case 'mandala':
      drawMandala(x, y, size, color, alpha);
      break;
    case 'spiral':
      drawSpiral(x, y, size, color, alpha);
      break;
    case 'fractal':
      drawFractal(x, y, size * 0.7, color, alpha);
      break;
    case 'flow':
      drawFlow(x, y, size, color, alpha);
      break;
    case 'crystal':
      drawCrystal(x, y, size, color, alpha);
      break;
    case 'noise':
      drawNoise(x, y, size, color, alpha);
      break;
  }
  
  addElement(x, y, currentPreset);
  updateStats();
}

function updateParticles(dt) {
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.98;
    p.vy *= 0.98;
    p.life -= dt;
    if (p.life <= 0) {
      particles.splice(i, 1);
    }
  }
}

function drawParticles() {
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    var alpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 5;
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

function updateStats() {
  document.getElementById('stats').textContent = 'ELEMENTS: ' + elements.length;
}

function randomize() {
  var hue1 = Math.floor(Math.random() * 360);
  var hue2 = (hue1 + 120) % 360;
  var hue3 = (hue1 + 240) % 360;
  
  config.color1 = hslToHex(hue1, 80, 60);
  config.color2 = hslToHex(hue2, 80, 60);
  config.color3 = hslToHex(hue3, 80, 60);
  
  document.getElementById('color1').value = config.color1;
  document.getElementById('color2').value = config.color2;
  document.getElementById('color3').value = config.color3;
  
  config.size = 5 + Math.floor(Math.random() * 30);
  config.density = 2 + Math.floor(Math.random() * 15);
  
  document.getElementById('sizeSlider').value = config.size;
  document.getElementById('densitySlider').value = config.density;
}

function clearCanvas() {
  drawBackground();
  elements = [];
  particles = [];
  updateStats();
}

function saveImage() {
  var link = document.createElement('a');
  link.download = 'generative-art-' + Date.now() + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function applyPreset(preset) {
  currentPreset = preset;
  var presetConfig = presets[preset];
  config.symmetry = presetConfig.symmetry;
  config.size = presetConfig.size;
  config.density = presetConfig.density;
  
  document.getElementById('sizeSlider').value = config.size;
  document.getElementById('densitySlider').value = config.density;
  
  var names = {
    mandala: 'MANDALA MODE',
    spiral: 'SPIRAL MODE',
    fractal: 'FRACTAL MODE',
    flow: 'FLOW MODE',
    crystal: 'CRYSTAL MODE',
    noise: 'NOISE MODE'
  };
  document.getElementById('modeIndicator').textContent = names[preset] + ' - CLICK & DRAG';
  document.getElementById('btnMode').textContent = names[preset].split(' ')[0];
}

function update(dt) {
  updateParticles(dt);
}

function drawFrame() {
  drawParticles();
}

function gameLoop(ts) {
  var dt = Math.min((ts - lastTime)/1000, 0.05);
  lastTime = ts;
  
  update(dt);
  drawFrame();
  
  animId = requestAnimationFrame(gameLoop);
}

document.querySelectorAll('.preset-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    applyPreset(this.dataset.preset);
  });
});

document.getElementById('btnStart').addEventListener('click', function() {
  showScreen('studioScreen');
  initStudio();
  gameLoop(performance.now());
});

document.getElementById('btnMode').addEventListener('click', function() {
  var presetList = ['mandala', 'spiral', 'fractal', 'flow', 'crystal', 'noise'];
  var currentIndex = presetList.indexOf(currentPreset);
  var nextIndex = (currentIndex + 1) % presetList.length;
  applyPreset(presetList[nextIndex]);
});

document.getElementById('color1').addEventListener('input', function(e) {
  config.color1 = e.target.value;
});
document.getElementById('color2').addEventListener('input', function(e) {
  config.color2 = e.target.value;
});
document.getElementById('color3').addEventListener('input', function(e) {
  config.color3 = e.target.value;
});

document.getElementById('sizeSlider').addEventListener('input', function(e) {
  config.size = parseInt(e.target.value);
});
document.getElementById('densitySlider').addEventListener('input', function(e) {
  config.density = parseInt(e.target.value);
});

document.getElementById('btnRandom').addEventListener('click', randomize);
document.getElementById('btnClear').addEventListener('click', clearCanvas);
document.getElementById('btnSave').addEventListener('click', saveImage);

canvas.addEventListener('mousedown', handleDrawStart);
canvas.addEventListener('mousemove', handleDrawMove);
canvas.addEventListener('mouseup', handleDrawEnd);
canvas.addEventListener('mouseleave', handleDrawEnd);

canvas.addEventListener('touchstart', handleDrawStart);
canvas.addEventListener('touchmove', handleDrawMove);
canvas.addEventListener('touchend', handleDrawEnd);

window.addEventListener('resize', function() {
  var saved = canvas.toDataURL();
  resizeCanvas();
  var img = new Image();
  img.onload = function() {
    ctx.drawImage(img, 0, 0);
  };
  img.src = saved;
});
</script>
</body>
</html>
