<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跳一跳</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background:#0a0a0f;
  color:#f0f0ff;
  font-family:'Courier New','Lucida Console',monospace;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  overflow:hidden;
  user-select:none;
}

.screen { display:none; flex-direction:column; align-items:center; justify-content:center; width:100%; min-height:100vh; }
.screen.active { display:flex; }

#titleScreen {
  background: radial-gradient(ellipse at 50% 40%, #1a1a2e 0%, #0a0a0f 70%);
  gap:20px;
  overflow-y:auto;
  padding:20px;
}

.title-logo {
  font-family:'Impact','Arial Narrow',Arial,sans-serif;
  font-size:clamp(28px,6vw,72px);
  letter-spacing:0.05em;
  line-height:1.0;
  text-align:center;
  background:linear-gradient(135deg,#fff 0%,#aaffff 40%,#ffaa88 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  filter:drop-shadow(0 0 30px rgba(100,200,255,0.6));
  animation:logoFlicker 4s ease-in-out infinite;
}
@keyframes logoFlicker {
  0%,100% { filter:drop-shadow(0 0 30px rgba(100,200,255,0.6)); }
  50%      { filter:drop-shadow(0 0 50px rgba(255,170,100,0.9)); }
}

.title-sub {
  font-family:'Courier New','Lucida Console',monospace;
  font-size:clamp(9px,1.5vw,13px);
  letter-spacing:0.4em;
  color:#88ccff;
  margin-bottom:20px;
}

.controls-info {
  display:flex;
  gap:20px;
  margin-bottom:30px;
  flex-wrap:wrap;
  justify-content:center;
}

.control-block { text-align:center; }
.control-block .clabel {
  font-size:9px;
  letter-spacing:0.3em;
  color:#6688aa;
  font-family:'Courier New','Lucida Console',monospace;
  margin-bottom:10px;
}
.keys { display:flex; gap:4px; justify-content:center; flex-wrap:wrap; }
.key {
  width:34px; height:34px;
  background:#1a1a28;
  border:1px solid #333355;
  border-radius:6px;
  display:flex; align-items:center; justify-content:center;
  font-size:11px;
  color:#aaaccc;
  font-family:'Courier New','Lucida Console',monospace;
  box-shadow:0 3px 0 #111133;
}

.btn-start {
  font-family:'Impact','Arial Narrow',Arial,sans-serif;
  font-size:26px;
  letter-spacing:0.15em;
  padding:14px 56px;
  background:linear-gradient(135deg,#44ff88,#00ccff);
  border:none;
  border-radius:4px;
  color:#000;
  cursor:pointer;
  transition:transform 0.1s,box-shadow 0.1s;
  box-shadow:0 0 30px rgba(100,255,150,0.5),0 4px 0 #11aa55;
  position:relative;
  z-index:1;
}
.btn-start:hover { transform:translateY(-2px); box-shadow:0 0 50px rgba(100,255,200,0.7),0 6px 0 #11aa55; }
.btn-start:active { transform:translateY(2px); box-shadow:0 0 20px rgba(100,255,150,0.4),0 1px 0 #11aa55; }

#gameScreen { position:relative; padding:0; background:#050508; }
#gameCanvas { display:block; }

#hud {
  position:absolute;
  top:0; left:0; right:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 18px;
  background:linear-gradient(to bottom,rgba(5,5,15,0.92),transparent);
  pointer-events:none;
}

.hud-item {
  font-size:12px;
  letter-spacing:0.1em;
  font-family:'Courier New','Lucida Console',monospace;
  display:flex;
  flex-direction:column;
  gap:4px;
}
.hud-label { font-size:9px; letter-spacing:0.3em; color:#8888aa; }
.hud-value { font-size:20px; font-family:'Impact','Arial Narrow',Arial,sans-serif; letter-spacing:0.1em; color:#44ff88; }

#powerBar {
  position:absolute;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  width:200px;
  height:20px;
  background:rgba(0,0,0,0.5);
  border:2px solid #333;
  border-radius:10px;
  overflow:hidden;
  display:none;
}
#powerFill {
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#44ff88,#ffcc00,#ff4444);
  transition:none;
}

#comboPopup {
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  font-family:'Impact','Arial Narrow',Arial,sans-serif;
  font-size:48px;
  color:#ffcc00;
  text-shadow:0 0 30px rgba(255,200,0,0.9);
  pointer-events:none;
  opacity:0;
  z-index:5;
}
#comboPopup.show { animation:comboPopup 0.8s ease-out forwards; }
@keyframes comboPopup {
  0% { opacity:0; transform:translate(-50%,-50%) scale(0.5); }
  20% { opacity:1; transform:translate(-50%,-50%) scale(1.2); }
  100% { opacity:0; transform:translate(-50%,-70%) scale(1); }
}

#resultScreen {
  background:radial-gradient(ellipse at 50% 50%, #1a1a2e 0%, #0a0a0f 70%);
  gap:18px;
}
.result-title {
  font-family:'Impact','Arial Narrow',Arial,sans-serif;
  font-size:clamp(36px,9vw,80px);
  letter-spacing:0.1em;
  text-align:center;
  color:#ff4444;
}
.result-subtitle {
  font-size:11px;
  letter-spacing:0.3em;
  color:#88ccff;
  font-family:'Courier New','Lucida Console',monospace;
  text-align:center;
  margin-bottom:16px;
}
.result-stats {
  display:flex;
  gap:30px;
  margin-bottom:24px;
  flex-wrap:wrap;
  justify-content:center;
}
.stat-block {
  text-align:center;
  padding:18px 28px;
  background:rgba(255,255,255,0.03);
  border:1px solid #223344;
  border-radius:8px;
}
.stat-label { font-size:8px; letter-spacing:0.4em; color:#6688aa; font-family:'Courier New','Lucida Console',monospace; margin-bottom:6px; }
.stat-val { font-family:'Impact','Arial Narrow',Arial,sans-serif; font-size:34px; letter-spacing:0.05em; color:#44ff88; }
.btn-row { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
.btn-secondary {
  font-family:'Impact','Arial Narrow',Arial,sans-serif;
  font-size:20px;
  letter-spacing:0.15em;
  padding:12px 38px;
  background:transparent;
  border:1px solid #335566;
  border-radius:4px;
  color:#88ccff;
  cursor:pointer;
  transition:all 0.15s;
}
.btn-secondary:hover { border-color:#44ff88; color:#44ff88; background:rgba(100,255,150,0.1); }

.title-subtitle {
  font-family:'Courier New','Lucida Console',monospace;
  font-size:clamp(9px,1.5vw,13px);
  letter-spacing:0.3em;
  color:#88ccff;
  margin-bottom:20px;
}

.leaderboard-container {
  width:100%;
  max-width:400px;
  margin:20px auto;
}

.leaderboard-item {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 20px;
  margin:8px 0;
  background:rgba(255,255,255,0.03);
  border:1px solid #223344;
  border-radius:8px;
  transition:all 0.15s;
}

.leaderboard-item:hover {
  border-color:#44ff88;
  background:rgba(100,255,150,0.05);
}

.leaderboard-rank {
  font-family:'Impact','Arial Narrow',Arial,sans-serif;
  font-size:28px;
  color:#88ccff;
  min-width:40px;
}

.leaderboard-rank.gold { color:#ffcc00; text-shadow:0 0 10px rgba(255,200,0,0.5); }
.leaderboard-rank.silver { color:#c0c0c0; text-shadow:0 0 10px rgba(192,192,192,0.5); }
.leaderboard-rank.bronze { color:#cd7f32; text-shadow:0 0 10px rgba(205,127,50,0.5); }

.leaderboard-score {
  font-family:'Impact','Arial Narrow',Arial,sans-serif;
  font-size:28px;
  color:#44ff88;
}

.leaderboard-empty {
  text-align:center;
  color:#88aa88;
  font-family:'Courier New','Lucida Console',monospace;
  padding:40px 20px;
}

#leaderboardScreen {
  background:radial-gradient(ellipse at 50% 40%, #1a1a2e 0%, #0a0a0f 70%);
  gap:0;
}
</style>
</head>
<body>

<div class="screen active" id="titleScreen">
  <div class="title-logo">跳一跳</div>
  <div class="title-sub">按住蓄力，松开跳跃</div>

  <div class="controls-info">
    <div class="control-block">
      <div class="clabel">操作方式</div>
      <div class="keys">
        <div class="key">按住</div>
      </div>
    </div>
  </div>

  <div class="btn-row" style="margin-top: 20px;">
    <button class="btn-start" id="btnStart">开始游戏</button>
    <button class="btn-secondary" id="btnLeaderboard">排行榜</button>
  </div>
</div>

<div class="screen" id="gameScreen">
  <canvas id="gameCanvas"></canvas>
  <div id="hud">
    <div class="hud-item">
      <div class="hud-label">分数</div>
      <div class="hud-value" id="scoreDisplay">0</div>
    </div>
    <div class="hud-item">
      <div class="hud-label">最高分</div>
      <div class="hud-value" id="highScoreDisplay">0</div>
    </div>
    <div class="hud-item">
      <div class="hud-label">连击</div>
      <div class="hud-value" id="comboDisplay">0</div>
    </div>
  </div>
  <div id="powerBar"><div id="powerFill"></div></div>
  <div id="comboPopup"></div>
</div>

<div class="screen" id="resultScreen">
  <div class="result-title">游戏结束</div>
  <div class="result-subtitle">再接再厉！</div>
  <div class="result-stats" id="resultStats"></div>
  <div class="btn-row">
    <button class="btn-start" id="btnRematch">再来一次</button>
    <button class="btn-secondary" id="btnMenu">返回主菜单</button>
  </div>
</div>

<div class="screen" id="leaderboardScreen">
  <div class="title-logo">排行榜</div>
  <div class="title-subtitle">你的最高分记录</div>
  <div class="leaderboard-container" id="leaderboardContainer"></div>
  <div class="btn-row" style="margin-top: 20px;">
    <button class="btn-start" id="btnBackFromLeaderboard">返回</button>
  </div>
</div>

<script>
var canvas = document.getElementById('gameCanvas');
var ctx = canvas.getContext('2d');

var animId = null;
var gameRunning = false;
var lastTime = 0;
var score = 0;
var combo = 0;
var highScore = parseInt(localStorage.getItem('jumpGameHighScore') || '0');
var leaderboard = JSON.parse(localStorage.getItem('jumpGameLeaderboard') || '[]');
var screenShake = 0;
var shakeX = 0;
var shakeY = 0;

var player = null;
var platforms = [];
var particles = [];
var camera = { x: 0, y: 0, targetX: 0, targetY: 0 };

var isCharging = false;
var chargeTime = 0;
var maxChargeTime = 1500;

var debugMode = false;

var platformColors = [
  '#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4',
  '#ffeaa7', '#dfe6e9', '#fd79a8', '#a29bfe'
];

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}

function resizeCanvas() {
  var W = Math.max(600, Math.min(window.innerWidth, 920));
  var H = Math.max(440, Math.min(window.innerHeight, 680));
  canvas.width = W;
  canvas.height = H;
}

function initGame() {
  resizeCanvas();
  
  score = 0;
  combo = 0;
  screenShake = 0;
  platforms = [];
  particles = [];
  
  camera = { x: 0, y: 0, targetX: 0, targetY: 0 };
  
  var startPlatform = {
    x: 0,
    y: 0,
    width: 120,
    height: 80,
    color: '#44ff88',
    landed: true
  };
  platforms.push(startPlatform);
  
  for (var i = 0; i < 5; i++) {
    generateNextPlatform();
  }
  
  player = {
    x: startPlatform.x,
    y: startPlatform.y - startPlatform.height / 2 - 20,
    vx: 0,
    vy: 0,
    width: 30,
    height: 40,
    isJumping: false,
    isOnPlatform: true,
    rotation: 0,
    squash: 1,
    stretch: 1
  };
  
  updateHUD();
  document.getElementById('highScoreDisplay').textContent = highScore;
  drawFrame();
}

function generateNextPlatform() {
  var lastPlatform = platforms[platforms.length - 1];
  var distance = 150 + Math.random() * 200;
  
  var dx = distance;
  var dy = 0;
  
  // 根据分数计算平台大小系数，每100分平台变小一点
  var difficultyLevel = Math.floor(score / 100);
  var sizeFactor = Math.max(0.4, 1 - difficultyLevel * 0.1);
  
  var newWidth = (60 + Math.random() * 80) * sizeFactor;
  var newHeight = (60 + Math.random() * 40) * sizeFactor;
  
  platforms.push({
    x: lastPlatform.x + dx,
    y: lastPlatform.y + dy,
    width: newWidth,
    height: newHeight,
    color: platformColors[Math.floor(Math.random() * platformColors.length)],
    landed: false
  });
}

function spawnParticles(x, y, color, count) {
  for (var i = 0; i < count; i++) {
    var a = Math.random() * Math.PI * 2;
    var sp = 50 + Math.random() * 150;
    particles.push({
      x: x,
      y: y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 100,
      r: 2 + Math.random() * 4,
      life: 0.5 + Math.random() * 0.5,
      color: color,
      gravity: 300 + Math.random() * 200
    });
  }
}

function showComboPopup(text) {
  var popup = document.getElementById('comboPopup');
  popup.textContent = text;
  popup.classList.remove('show');
  void popup.offsetHeight;
  popup.classList.add('show');
}

function updateParticles(dt) {
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += p.gravity * dt;
    p.life -= dt;
    p.r = Math.max(0, p.r - 3 * dt);
  }
  particles = particles.filter(function(p){ return p.life > 0; });
}

function update(dt) {
  if (isCharging && !player.isJumping) {
    chargeTime += dt * 1000;
    chargeTime = Math.min(chargeTime, maxChargeTime);
    var powerPercent = (chargeTime / maxChargeTime) * 100;
    document.getElementById('powerFill').style.width = powerPercent + '%';
    
    player.squash = 1 - (powerPercent / 100) * 0.3;
    player.stretch = 1 + (powerPercent / 100) * 0.2;
  }
  
  if (player.isJumping) {
    player.vy += 800 * dt;
    player.x += player.vx * dt;
    player.y += player.vy * dt;
    player.rotation += dt * 5;
    
    for (var i = 0; i < platforms.length; i++) {
      var p = platforms[i];
      if (!p.landed && player.vy > 0) {
        var playerBottom = player.y + player.height / 2;
        var playerLeft = player.x - player.width / 2;
        var playerRight = player.x + player.width / 2;
        
        var platformTop = p.y;
        var platformLeft = p.x - p.width / 2 - 30;
        var platformRight = p.x + p.width / 2 + 30;
        
        if (playerBottom >= platformTop && 
            playerBottom <= platformTop + 50 &&
            playerRight > platformLeft && 
            playerLeft < platformRight) {
          
          player.y = platformTop - player.height / 2;
          player.vy = 0;
          player.vx = 0;
          player.isJumping = false;
          player.isOnPlatform = true;
          player.rotation = 0;
          player.squash = 0.7;
          player.stretch = 1.3;
          p.landed = true;
          
          var centerDist = Math.abs(player.x - p.x);
          var perfect = centerDist < 15;
          
          if (perfect) {
            combo++;
            var bonus = combo >= 2 ? combo : 1;
            score += 2 * bonus;
            spawnParticles(player.x, player.y + player.height / 2, '#ffcc00', 30);
            showComboPopup(combo >= 2 ? '完美! x' + combo : '完美!');
            screenShake = 0.2;
          } else {
            combo = 0;
            score += 1;
            spawnParticles(player.x, player.y + player.height / 2, p.color, 15);
          }
          
          while (platforms.length < 8) {
            generateNextPlatform();
          }
          
          updateHUD();
          break;
        }
      }
    }
    
    // 移除左边屏幕外的平台
    var screenLeft = camera.x - canvas.width;
    platforms = platforms.filter(function(p) {
      return p.x > screenLeft - 200;
    });
    
    if (player.y > camera.y + canvas.height) {
      endGame();
      return;
    }
  }
  
  player.squash += (1 - player.squash) * 5 * dt;
  player.stretch += (1 - player.stretch) * 5 * dt;
  
  camera.targetX = player.x;
  camera.targetY = player.y - 100;
  camera.x += (camera.targetX - camera.x) * 5 * dt;
  camera.y += (camera.targetY - camera.y) * 5 * dt;
  
  screenShake = Math.max(0, screenShake - dt * 3);
  shakeX = (Math.random() - 0.5) * screenShake * 20;
  shakeY = (Math.random() - 0.5) * screenShake * 20;
  
  updateParticles(dt);
}

function drawFrame() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  ctx.save();
  ctx.translate(canvas.width / 2 - camera.x + shakeX, canvas.height / 2 - camera.y + shakeY);
  
  var gradient = ctx.createLinearGradient(0, camera.y - 500, 0, camera.y + 500);
  gradient.addColorStop(0, '#1a1a2e');
  gradient.addColorStop(1, '#0a0a0f');
  ctx.fillStyle = gradient;
  ctx.fillRect(camera.x - canvas.width, camera.y - canvas.height, canvas.width * 2, canvas.height * 2);
  
  for (var i = 0; i < platforms.length; i++) {
    drawPlatform(platforms[i]);
  }
  
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  
  if (player) {
    drawPlayer();
  }
  
  if (debugMode) {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#ff0000';
    ctx.font = 'bold 16px Arial';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText('DEBUG MODE ON (F1 to toggle)', 10, 10);
    ctx.restore();
  }
  
  ctx.restore();
}

function drawPlatform(p) {
  ctx.save();
  
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(p.x + 5, p.y + p.height / 2 + 5, p.width / 2, p.height / 4, 0, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.fillStyle = p.color;
  ctx.shadowColor = p.color;
  ctx.shadowBlur = 20;
  
  ctx.beginPath();
  ctx.moveTo(p.x - p.width / 2, p.y);
  ctx.lineTo(p.x - p.width / 2, p.y + p.height / 2);
  ctx.quadraticCurveTo(p.x - p.width / 2, p.y + p.height, p.x, p.y + p.height);
  ctx.quadraticCurveTo(p.x + p.width / 2, p.y + p.height, p.x + p.width / 2, p.y + p.height / 2);
  ctx.lineTo(p.x + p.width / 2, p.y);
  ctx.closePath();
  ctx.fill();
  
  ctx.shadowBlur = 0;
  
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.beginPath();
  ctx.ellipse(p.x, p.y, p.width / 2, p.height / 4, 0, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(p.x, p.y, p.width / 2, p.height / 4, 0, 0, Math.PI * 2);
  ctx.stroke();
  
  if (debugMode) {
    ctx.strokeStyle = '#ff0000';
    ctx.lineWidth = 2;
    ctx.strokeRect(p.x - p.width / 2 - 30, p.y, p.width + 60, 50);
  }
  
  ctx.restore();
}

function drawPlayer() {
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.rotation);
  ctx.scale(player.stretch, player.squash);
  
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(3, player.height / 2 + 5, player.width / 3, player.height / 6, 0, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.fillStyle = '#4488ff';
  ctx.shadowColor = '#4488ff';
  ctx.shadowBlur = 15;
  
  ctx.beginPath();
  ctx.moveTo(0, -player.height / 2);
  ctx.lineTo(player.width / 4, -player.height / 4);
  ctx.lineTo(player.width / 2, player.height / 4);
  ctx.lineTo(player.width / 4, player.height / 2);
  ctx.lineTo(-player.width / 4, player.height / 2);
  ctx.lineTo(-player.width / 2, player.height / 4);
  ctx.lineTo(-player.width / 4, -player.height / 4);
  ctx.closePath();
  ctx.fill();
  
  ctx.shadowBlur = 0;
  
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath();
  ctx.moveTo(0, -player.height / 2);
  ctx.lineTo(-player.width / 4, -player.height / 4);
  ctx.lineTo(-player.width / 2, player.height / 4);
  ctx.lineTo(-player.width / 4, player.height / 2);
  ctx.lineTo(0, player.height / 4);
  ctx.closePath();
  ctx.fill();
  
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-5, -5, 5, 0, Math.PI * 2);
  ctx.arc(5, -5, 5, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(-5, -4, 2, 0, Math.PI * 2);
  ctx.arc(5, -4, 2, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.restore();
  
  if (debugMode) {
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.strokeStyle = '#00ff00';
    ctx.lineWidth = 2;
    ctx.strokeRect(-player.width / 2, -player.height / 2, player.width, player.height);
    ctx.restore();
  }
}

function updateHUD() {
  document.getElementById('scoreDisplay').textContent = score;
  document.getElementById('comboDisplay').textContent = combo;
}

function saveToLeaderboard(scoreValue) {
  var newEntry = {
    score: scoreValue,
    date: new Date().toLocaleDateString('zh-CN'),
    time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
  };
  
  leaderboard.push(newEntry);
  leaderboard.sort(function(a, b) {
    return b.score - a.score;
  });
  
  // 只保留前10名
  if (leaderboard.length > 10) {
    leaderboard = leaderboard.slice(0, 10);
  }
  
  localStorage.setItem('jumpGameLeaderboard', JSON.stringify(leaderboard));
}

function showLeaderboard() {
  var container = document.getElementById('leaderboardContainer');
  
  if (leaderboard.length === 0) {
    container.innerHTML = '<div class="leaderboard-empty">还没有记录，快去玩一局吧！</div>';
  } else {
    var html = '';
    for (var i = 0; i < leaderboard.length; i++) {
      var rankClass = '';
      if (i === 0) rankClass = 'gold';
      else if (i === 1) rankClass = 'silver';
      else if (i === 2) rankClass = 'bronze';
      
      html += '<div class="leaderboard-item">' +
              '<div class="leaderboard-rank ' + rankClass + '">#' + (i + 1) + '</div>' +
              '<div class="leaderboard-score">' + leaderboard[i].score + ' 分</div>' +
              '</div>';
    }
    container.innerHTML = html;
  }
  
  showScreen('leaderboardScreen');
}

function jump() {
  if (player.isJumping || !player.isOnPlatform) return;
  
  var power = chargeTime / maxChargeTime;
  power = Math.max(0.2, Math.min(1, power));
  
  var jumpPower = 200 + power * 300;
  
  var nextPlatform = null;
  for (var i = 0; i < platforms.length; i++) {
    if (!platforms[i].landed) {
      nextPlatform = platforms[i];
      break;
    }
  }
  
  var jumpAngle = -Math.PI / 3;
  if (nextPlatform) {
    var dx = nextPlatform.x - player.x;
    var dy = nextPlatform.y - player.y;
    jumpAngle = Math.atan2(dy - 200, dx);
  }
  
  player.vx = Math.abs(Math.cos(jumpAngle)) * jumpPower;
  player.vy = -Math.abs(Math.sin(jumpAngle)) * jumpPower - 200;
  player.isJumping = true;
  player.isOnPlatform = false;
  player.squash = 1.3;
  player.stretch = 0.7;
  
  spawnParticles(player.x, player.y + player.height / 2, '#44ff88', 20);
  
  chargeTime = 0;
  document.getElementById('powerBar').style.display = 'none';
  document.getElementById('powerFill').style.width = '0%';
}

function endGame() {
  gameRunning = false;
  cancelAnimationFrame(animId);
  
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('jumpGameHighScore', highScore.toString());
  }
  
  if (score > 0) {
    saveToLeaderboard(score);
  }
  
  document.getElementById('resultStats').innerHTML =
    '<div class="stat-block"><div class="stat-label">最终分数</div><div class="stat-val">'+score+'</div></div>'+
    '<div class="stat-block"><div class="stat-label">最高分</div><div class="stat-val">'+highScore+'</div></div>';
  
  setTimeout(function() { showScreen('resultScreen'); }, 200);
}

function gameLoop(ts) {
  if (!gameRunning) return;
  var dt = Math.min((ts - lastTime)/1000, 0.05);
  lastTime = ts;
  
  update(dt);
  drawFrame();
  
  animId = requestAnimationFrame(gameLoop);
}

function startCharge(e) {
  if (!gameRunning || player.isJumping) return;
  e.preventDefault();
  isCharging = true;
  chargeTime = 0;
  document.getElementById('powerBar').style.display = 'block';
}

function endCharge(e) {
  if (!gameRunning || !isCharging) return;
  e.preventDefault();
  isCharging = false;
  jump();
}

document.addEventListener('mousedown', startCharge);
document.addEventListener('mouseup', endCharge);
document.addEventListener('touchstart', startCharge);
document.addEventListener('touchend', endCharge);

document.addEventListener('keydown', function(e) {
  if (e.key === 'F1') {
    e.preventDefault();
    debugMode = !debugMode;
  }
});

document.getElementById('btnStart').addEventListener('click', function() {
  showScreen('gameScreen');
  initGame();
  gameRunning = true;
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
});

document.getElementById('btnRematch').addEventListener('click', function() {
  showScreen('gameScreen');
  initGame();
  gameRunning = true;
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
});

document.getElementById('btnMenu').addEventListener('click', function() {
  gameRunning = false;
  cancelAnimationFrame(animId);
  showScreen('titleScreen');
});

document.getElementById('btnLeaderboard').addEventListener('click', function() {
  showLeaderboard();
});

document.getElementById('btnBackFromLeaderboard').addEventListener('click', function() {
  showScreen('titleScreen');
});

document.getElementById('highScoreDisplay').textContent = highScore;
</script>
</body>
</html>
